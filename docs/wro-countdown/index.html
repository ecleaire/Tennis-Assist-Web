<body>
<script>
(async () => {
  const startApp = () => import("./v2/entry.js?v=20260926k");

  if (!("serviceWorker" in navigator)) {
    await startApp();
    return;
  }

  try {
    const registration = await navigator.serviceWorker.register("./sw.js", {
      scope: "./",
      updateViaCache: "none"
    });
    await registration.update();
    await navigator.serviceWorker.ready;

    // On the first visit, wait until clients.claim() gives this page a
    // controller before importing the module graph. That makes even nested JS
    // imports go through the no-store service worker immediately.
    if (!navigator.serviceWorker.controller) {
      await new Promise(resolve => {
        const timer = window.setTimeout(resolve, 5000);
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          window.clearTimeout(timer);
          resolve();
        }, { once: true });
      });
    }
  } catch (error) {
    console.warn("WRO Countdown freshness service worker unavailable", error);
  }

  await startApp();
})().catch(error => {
  console.error("WRO Countdown bootstrap failed", error);
});
</script>
