name: WRO Countdown Check
on:
  workflow_dispatch:
  push:
    paths:
      - "docs/wro-countdown/**"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          for file in docs/wro-countdown/v2/*.js; do
            node --check "$file"
          done
