<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061014">
<meta name="color-scheme" content="dark">
<title>GAME RESULT</title>
<link rel="stylesheet" href="./style.css">
<style>
.score{
  font-size:clamp(1.6rem,7.6vw,3.5rem);
  letter-spacing:-.035em;
  line-height:1.12;
}
.score>.ink{
  column-gap:clamp(8px,1.6vw,14px);
  align-items:baseline;
}
.score b{line-height:1.12}
.score .vs{
  font-size:.42em;
  line-height:1;
  letter-spacing:.1em;
}
@media(orientation:landscape) and (max-height:560px){
  .score{font-size:clamp(1.35rem,4.7vw,2.6rem)}
}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="リザルト表示。画面をクリックすると演出を再生します">
<section class="card" id="card">
<p class="reveal eyebrow" data-duration="420" data-gap="25"><span class="ink">ROBO SPORTS / MATCH RESULT</span></p>
<h1 class="reveal title" data-duration="680" data-gap="95"><span class="ink">GAME RESULT</span></h1>
<div class="divider"></div>
<p class="reveal meta" data-duration="380" data-gap="40"><span class="ink">MATCH COMPLETE</span></p>
<p class="reveal matchup" data-duration="650" data-gap="70"><span class="ink"><span id="va">チーム名A</span><span class="vs">VS</span><span id="vb">チーム名B</span></span></p>
<p class="reveal score" data-duration="540" data-gap="80" id="score"><span class="ink"><b id="vsa">2</b><i class="vs">VS</i><b id="vsb">1</b></span></p>
<p class="reveal result-label" data-duration="330" data-gap="35"><span class="ink" id="label">WINNER</span></p>
<p class="reveal outcome" data-duration="560" data-gap="0"><span class="ink" id="vr">チーム名A</span></p>
</section>
</main>
<div class="actions">
<button class="pill" id="edit" type="button">入力</button>
<button class="pill" id="replay" type="button">REPLAY</button>
<button class="pill" id="share" type="button">共有</button>
</div>
<div class="editor" id="editor" role="dialog" aria-modal="true" aria-labelledby="form-title">
<form class="sheet" id="form">
<div class="head"><div><p>RESULT SETTINGS</p><h2 id="form-title">表示内容を入力</h2></div><button class="close" id="close" type="button" aria-label="閉じる">×</button></div>
<div class="fields">
<label>チーム名A<input id="a" type="text" maxlength="40" value="チーム名A" autocomplete="off"></label>
<label>チーム名B<input id="b" type="text" maxlength="40" value="チーム名B" autocomplete="off"></label>
<div class="scores"><label>スコアA<input id="sa" type="number" inputmode="numeric" min="0" max="99" value="2"></label><span>VS</span><label>スコアB<input id="sb" type="number" inputmode="numeric" min="0" max="99" value="1"></label></div>
<label>勝者・結果<select id="type"><option value="draw">引き分け</option><option value="a" selected>チームAの勝利</option><option value="b">チームBの勝利</option><option value="custom">自由入力</option></select></label>
<label class="custom" id="custom-wrap" hidden>表示する勝者・結果<input id="custom" type="text" maxlength="40" placeholder="例：判定中止" autocomplete="off"></label>
</div>
<div class="form-actions"><button class="secondary" id="reset" type="button">初期値に戻す</button><button class="primary" type="submit">演出を表示</button></div>
<p class="notice" id="notice">表示後に「共有」を押すと、この内容をURLで送れます。</p>
</form>
</div>
<script src="./app.js"></script>
<script>
(()=>{
  fitScore=function(){
    const scoreLine=document.getElementById("score");
    const scoreInk=scoreLine.querySelector(".ink");
    const matchup=document.querySelector(".matchup");
    const card=document.getElementById("card");
    scoreLine.style.removeProperty("font-size");
    const teamSize=parseFloat(getComputedStyle(matchup).fontSize)||24;
    scoreLine.style.fontSize=`${teamSize}px`;
    const available=Math.max(1,card.clientWidth);
    const natural=Math.max(1,scoreInk.scrollWidth);
    if(natural>available){
      scoreLine.style.fontSize=`${Math.max(17,teamSize*(available/natural)*.985)}px`;
    }
  };
  if(typeof scheduleLayout==="function")scheduleLayout();
})();
</script>
</body>
</html>
