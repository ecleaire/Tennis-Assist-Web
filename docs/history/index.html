<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#091329" />
    <title>RoboSports Assist | 対戦履歴・統計</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">ROBOSPORTS ASSIST / ADMIN VIEWER</p>
          <h1>対戦履歴・統計</h1>
        </div>
        <div class="top-actions">
          <span id="account-label" class="account-label hidden"></span>
          <button id="logout" class="button ghost hidden" type="button">ログアウト</button>
        </div>
      </header>
      <nav class="public-nav" aria-label="公開メニュー">
        <button id="public-login-tab" class="active" type="button">管理ログイン</button>
        <button id="public-links-tab" type="button">リンク</button>
        <button id="public-rules-tab" type="button">ルール</button>
      </nav>

      <section id="login-panel" class="panel login-panel public-pane">
        <p class="eyebrow">SECURE READ-ONLY VIEW</p>
        <h2>管理アカウントでログイン</h2>
        <p class="muted">このページでは、対戦履歴と統計だけを確認できます。試合の編集・送信・設定変更はできません。</p>
        <form id="login-form" class="login-form">
          <label>管理者パスワード<input id="password" type="password" autocomplete="current-password" required /></label>
          <label>APIキー <span class="optional">（メインアプリで保存済みなら空欄可）</span><input id="api-key" type="password" autocomplete="off" /></label>
          <label class="remember-login"><input id="remember-login" type="checkbox" /> この端末にログイン情報を保存する</label>
          <button class="button primary" type="submit">ログインして履歴を読み込む</button>
        </form>
        <p id="login-status" class="status" role="status"></p>
      </section>

      <section id="public-links" class="panel section-card public-pane hidden">
        <p class="eyebrow">PUBLIC LINKS</p>
        <h2>関連リンク</h2>
        <div id="public-links-list" class="public-links-list"></div>
      </section>

      <section id="public-rules" class="panel section-card public-pane hidden">
        <p class="eyebrow">RULES QUICK REFERENCE</p>
        <h2>ルール確認</h2>
        <p id="rules-source" class="muted compact"></p>
        <div id="rules-list" class="rules-list"></div>
      </section>

      <section id="viewer" class="hidden">
        <div class="toolbar panel toolbar-panel">
          <div>
            <strong id="source-label">データソース</strong>
            <p id="loaded-at" class="muted compact"></p>
          </div>
          <button id="refresh" class="button" type="button">再読み込み</button>
        </div>

        <section class="stats-grid" aria-label="大会統計">
          <article class="stat-card"><span>試合結果</span><strong id="stat-series">--</strong></article>
          <article class="stat-card"><span>マッチ</span><strong id="stat-matches">--</strong></article>
          <article class="stat-card"><span>チーム数</span><strong id="stat-teams">--</strong></article>
          <article class="stat-card"><span>最終更新</span><strong id="stat-latest">--</strong></article>
        </section>

        <section class="panel section-card">
          <div class="section-heading"><div><p class="eyebrow">TEAM STATISTICS</p><h2>チーム別統計</h2></div></div>
          <div class="filter-row"><label>チーム<select id="stats-team"><option value="">チームを選択</option></select></label><label>集計期間<select id="period"><option value="all">すべて</option><option value="today">今日</option><option value="week">1週間</option><option value="month">1か月</option></select></label><label>開始日<input id="date-from" type="date" /></label><label>終了日<input id="date-to" type="date" /></label></div>
          <div id="selected-team-stats" class="stats-grid team-metrics" aria-live="polite"></div>
          <div class="table-wrap"><table><thead><tr><th>チーム</th><th>マッチ数</th><th>勝敗</th><th>勝率</th><th>紫取得率</th><th>違反数</th></tr></thead><tbody id="team-stats"></tbody></table></div>
        </section>

        <section class="panel section-card">
          <div class="section-heading"><div><p class="eyebrow">MATCH HISTORY</p><h2>対戦履歴</h2></div></div>
          <div class="filter-row"><label>履歴検索チーム<select id="team-filter"><option value="">すべてのチーム</option></select></label><label>勝敗<select id="result-filter"><option value="all">勝敗すべて</option><option value="win">勝利のみ</option><option value="loss">敗北のみ</option><option value="draw">引き分けのみ</option></select></label><label>種類<select id="kind-filter"><option value="all">すべて表示</option><option value="match">マッチ結果のみ</option><option value="series">試合結果のみ</option><option value="unsent">未送信のみ</option></select></label><label>未送信理由<select id="reason-filter"><option value="all">すべて</option><option value="APIキー未入力">APIキー未入力</option><option value="GAS未接続">GAS未接続</option><option value="ネットワーク">ネットワーク</option><option value="APIキー不一致">APIキー不一致</option></select></label><label>並び順<select id="sort-filter"><option value="new">新しい順</option><option value="old">古い順</option></select></label></div>
          <p id="history-status" class="muted compact"></p>
          <div id="history-list" class="history-list"></div>
        </section>
      </section>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
