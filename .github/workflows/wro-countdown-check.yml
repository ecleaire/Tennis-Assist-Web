name: WRO Countdown Check
on:
  workflow_dispatch:
  push:
    paths:
      - "docs/wro-countdown/**"
      - "scripts/wro-countdown-layout-check.mjs"
      - "scripts/wro-countdown-date-check.mjs"
      - "scripts/wro-countdown-anchor-check.mjs"
      - "scripts/wro-countdown-sound-check.mjs"
      - "scripts/wro-countdown-defaults-check.mjs"
      - "scripts/wro-countdown-typography-check.mjs"
      - "scripts/wro-countdown-frameless-check.mjs"
      - "scripts/wro-countdown-background-check.mjs"
      - "scripts/wro-countdown-settings-layout-check.mjs"
      - "scripts/wro-countdown-settings-audit-check.mjs"
      - "scripts/wro-countdown-settings-recovery-check.mjs"
      - "scripts/wro-countdown-stable-url-check.mjs"
      - "scripts/wro-countdown-full-function-check.mjs"
      - "scripts/wro-countdown-completion-check.mjs"
      - "scripts/wro-countdown-completion-messages-check.mjs"
      - "scripts/wro-countdown-completion-auto-wro-check.mjs"
      - "scripts/wro-countdown-completion-fit-check.mjs"
      - "scripts/wro-countdown-completion-size-control-check.mjs"
      - "scripts/wro-countdown-timer-size-control-check.mjs"
      - "scripts/wro-countdown-per-text-auto-size-check.mjs"
      - "scripts/wro-countdown-clickable-size-controls-check.mjs"
      - "scripts/wro-countdown-real-settings-interaction-check.mjs"
      - ".github/workflows/wro-countdown-check.yml"
  pull_request:
    paths:
      - "docs/wro-countdown/**"
      - "scripts/wro-countdown-layout-check.mjs"
      - "scripts/wro-countdown-date-check.mjs"
      - "scripts/wro-countdown-anchor-check.mjs"
      - "scripts/wro-countdown-sound-check.mjs"
      - "scripts/wro-countdown-defaults-check.mjs"
      - "scripts/wro-countdown-typography-check.mjs"
      - "scripts/wro-countdown-frameless-check.mjs"
      - "scripts/wro-countdown-background-check.mjs"
      - "scripts/wro-countdown-settings-layout-check.mjs"
      - "scripts/wro-countdown-settings-audit-check.mjs"
      - "scripts/wro-countdown-settings-recovery-check.mjs"
      - "scripts/wro-countdown-stable-url-check.mjs"
      - "scripts/wro-countdown-full-function-check.mjs"
      - "scripts/wro-countdown-completion-check.mjs"
      - "scripts/wro-countdown-completion-messages-check.mjs"
      - "scripts/wro-countdown-completion-auto-wro-check.mjs"
      - "scripts/wro-countdown-completion-fit-check.mjs"
      - "scripts/wro-countdown-completion-size-control-check.mjs"
      - "scripts/wro-countdown-timer-size-control-check.mjs"
      - "scripts/wro-countdown-per-text-auto-size-check.mjs"
      - "scripts/wro-countdown-clickable-size-controls-check.mjs"
      - "scripts/wro-countdown-real-settings-interaction-check.mjs"
      - ".github/workflows/wro-countdown-check.yml"

concurrency:
  group: wro-countdown-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          for file in docs/wro-countdown/v2/*.js scripts/wro-countdown-*.mjs; do
            node --check "$file"
          done

      - name: Validate timer sound catalog
        run: node scripts/wro-countdown-sound-check.mjs

      - name: Install Chromium layout-test runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Run stable URL, full function, real settings, real-click sizing, per-text sizing, timer size, completion, responsive, background, typography, defaults, anchor, and date audits
        run: |
          python3 -m http.server 4173 --directory . >/tmp/wro-countdown-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:4173/docs/wro-countdown/ >/dev/null; then
              break
            fi
            sleep 1
          done
          node scripts/wro-countdown-stable-url-check.mjs
          node scripts/wro-countdown-full-function-check.mjs
          node scripts/wro-countdown-real-settings-interaction-check.mjs
          node scripts/wro-countdown-clickable-size-controls-check.mjs
          node scripts/wro-countdown-per-text-auto-size-check.mjs
          node scripts/wro-countdown-timer-size-control-check.mjs
          node scripts/wro-countdown-settings-audit-check.mjs
          node scripts/wro-countdown-settings-recovery-check.mjs
          node scripts/wro-countdown-completion-check.mjs
          node scripts/wro-countdown-completion-messages-check.mjs
          node scripts/wro-countdown-completion-auto-wro-check.mjs
          node scripts/wro-countdown-completion-fit-check.mjs
          node scripts/wro-countdown-completion-size-control-check.mjs
          node scripts/wro-countdown-layout-check.mjs
          node scripts/wro-countdown-settings-layout-check.mjs
          node scripts/wro-countdown-background-check.mjs
          node scripts/wro-countdown-frameless-check.mjs
          node scripts/wro-countdown-typography-check.mjs
          node scripts/wro-countdown-defaults-check.mjs
          node scripts/wro-countdown-anchor-check.mjs
          node scripts/wro-countdown-date-check.mjs

      - name: Upload layout audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wro-countdown-layout-audit
          path: artifacts/wro-countdown-layout
          if-no-files-found: ignore
