<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dceffc">
  <title>WRO三重大会 編成管理</title>
  <style>
    :root {
      --bg: #dceffc;
      --surface: #ffffff;
      --surface-strong: #f3f9fd;
      --line: #2d4252;
      --line-soft: #9ec8e2;
      --text: #111820;
      --muted: #4d6271;
      --accent: #268dcc;
      --accent-strong: #1478b5;
      --success: #157347;
      --warning: #9a5b00;
      --danger: #c62836;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    html { color-scheme: light; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "BIZ UDPGothic", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
      letter-spacing: 0;
      -webkit-text-size-adjust: 100%;
    }

    button, input, select { font: inherit; letter-spacing: 0; }

    button, select, input[type="time"], input[type="text"], input[type="password"] {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-strong);
      color: var(--text);
    }

    button {
      padding: 10px 18px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled { opacity: .48; cursor: not-allowed; }
    button.primary { background: var(--accent-strong); border-color: var(--accent); color: #ffffff; }
    button.success { background: var(--success); border-color: var(--success); color: #ffffff; }
    button.secondary { background: var(--surface); }
    button.danger { border-color: var(--danger); color: #ffd9dc; }

    select, input[type="time"], input[type="text"], input[type="password"] {
      width: 100%;
      padding: 9px 12px;
    }

    .shell { width: min(1480px, 100%); margin: 0 auto; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 66px;
      padding: 9px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .97);
    }

    .eyebrow { margin: 0 0 4px; color: var(--accent); font-size: 12px; font-weight: 900; }
    h1 { margin: 0; font-size: clamp(22px, 3vw, 34px); }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

    .status-band {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 8px 20px;
      border-bottom: 1px solid var(--line);
      background: #eef8ff;
    }

    .status-message { min-width: 0; color: var(--muted); font-weight: 700; }
    .status-message.success { color: var(--success); }
    .status-message.error { color: var(--danger); }
    .status-message.warning { color: var(--warning); }
    .updated-at { color: var(--muted); white-space: nowrap; font-size: 13px; }

    .warning-banner {
      margin: 14px 22px 0;
      padding: 12px 14px;
      border: 1px solid #a66e14;
      border-radius: var(--radius);
      background: #fff4dd;
      color: #694100;
      font-weight: 700;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 10px 20px 0;
    }

    .tab { background: var(--surface); }
    .tab[aria-selected="true"] { background: var(--accent-strong); border-color: var(--accent); color: #ffffff; }

    .workspace { padding: 12px 20px 24px; }
    .view[hidden] { display: none; }

    .section-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 10px;
    }

    .section-heading h2 { margin: 0; font-size: clamp(22px, 3vw, 31px); }
    .section-heading p { margin: 5px 0 0; color: var(--muted); }
    .section-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

    .group-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .group-panel { border-top: 4px solid var(--accent); padding-top: 12px; min-width: 0; }
    .group-panel h3 { margin: 0 0 10px; font-size: 23px; }
    .group-help { margin: 0 0 12px; color: var(--muted); font-size: 14px; }

    .group-row {
      display: grid;
      grid-template-columns: 58px minmax(180px, 1fr) repeat(5, minmax(62px, auto));
      align-items: center;
      gap: 8px;
      min-height: 68px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }

    .group-id { font-size: 20px; font-weight: 900; color: var(--accent); }
    .metric { text-align: center; min-width: 0; }
    .metric-label { display: block; color: var(--muted); font-size: 11px; }
    .metric-value { display: block; margin-top: 3px; font-size: 17px; font-weight: 900; }
    .seed { color: var(--success); }

    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; min-width: 980px; }
    th, td { padding: 11px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th { background: var(--surface); color: var(--muted); font-size: 13px; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    td.match-id { width: 76px; color: var(--accent); font-weight: 900; white-space: nowrap; }
    td.phase { width: 176px; font-weight: 800; }
    td.time { width: 130px; }
    td.winner { min-width: 140px; color: var(--success); font-weight: 800; }
    td.winner select { min-width: 150px; }

    .tournament-scroll {
      overflow-x: auto;
      overscroll-behavior-x: contain;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      background: #cfe8f8;
    }

    .tournament-tree {
      --tree-line: 3px;
      --line: #111820;
      min-width: 1080px;
      padding: 12px 28px 16px;
      color: #111820;
    }

    .champion-banner {
      position: relative;
      width: min(720px, 66%);
      margin: 0 auto 20px;
      padding: 9px 18px;
      border: 3px solid var(--line);
      background: #ffffff;
      text-align: center;
    }
    .champion-banner::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -20px;
      width: var(--tree-line);
      height: 20px;
      background: var(--line);
      transform: translateX(-50%);
    }
    .champion-name {
      display: block;
      font-size: clamp(24px, 2.5vw, 34px);
      font-weight: 900;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .tree-level-title {
      position: relative;
      z-index: 3;
      width: max-content;
      margin: 0 auto 4px;
      padding: 0 12px;
      background: #cfe8f8;
      color: #223746;
      text-align: center;
      font-size: 14px;
      font-weight: 900;
    }

    .tree-final {
      position: relative;
      width: 260px;
      margin: 0 auto 24px;
    }
    .tree-final::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -24px;
      width: var(--tree-line);
      height: 24px;
      background: var(--line);
      transform: translateX(-50%);
    }

    .tree-semifinals {
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, 260px);
      justify-content: space-around;
      gap: 120px;
      margin: 0 7% 24px;
    }
    .tree-semifinals::before {
      content: "";
      position: absolute;
      top: -14px;
      left: calc(25% - 1px);
      right: calc(25% - 1px);
      border-top: var(--tree-line) solid var(--line);
    }
    .tree-semifinals > .match-card::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -14px;
      width: var(--tree-line);
      height: 14px;
      background: var(--line);
      transform: translateX(-50%);
    }
    .tree-semifinals > .match-card::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -24px;
      width: var(--tree-line);
      height: 24px;
      background: var(--line);
      transform: translateX(-50%);
    }

    .tree-qualifiers {
      display: grid;
      grid-template-columns: repeat(2, minmax(420px, 1fr));
      gap: 96px;
      margin: 0 3%;
    }
    .qualifier-branch {
      position: relative;
      display: grid;
      grid-template-columns: 118px 260px;
      justify-content: center;
      gap: 18px;
      align-items: end;
    }
    .qualifier-branch::before {
      content: "";
      position: absolute;
      top: -14px;
      left: calc(50% - 125px);
      right: calc(50% - 125px);
      border-top: var(--tree-line) solid var(--line);
    }
    .qualifier-branch::after {
      content: "";
      position: absolute;
      left: 50%;
      top: -24px;
      width: var(--tree-line);
      height: 10px;
      background: var(--line);
      transform: translateX(-50%);
    }
    .qualifier-branch > .seed-card::before,
    .qualifier-branch > .match-card::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -14px;
      width: var(--tree-line);
      height: 14px;
      background: var(--line);
      transform: translateX(-50%);
    }

    .seed-card {
      position: relative;
      display: grid;
      place-items: center;
      width: 118px;
      height: 172px;
      padding: 25px 8px 8px;
      border: 3px solid var(--line);
      background: #ffffff;
      text-align: center;
    }
    .seed-card strong {
      display: block;
      max-height: 134px;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.1;
      writing-mode: vertical-rl;
      text-orientation: upright;
      overflow: hidden;
    }
    .seed-card strong.is-long { font-size: 15px; }
    .seed-card strong.is-very-long { font-size: 12px; }
    .seed-badge {
      position: absolute;
      top: 7px;
      left: 5px;
      right: 5px;
      color: var(--accent-strong);
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .match-card {
      position: relative;
      min-width: 0;
      background: transparent;
      text-align: center;
    }
    .match-head {
      display: grid;
      place-items: center;
      min-height: 24px;
      margin-bottom: 2px;
    }
    .match-name {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .match-time {
      color: #111820;
      font-size: 17px;
      font-weight: 900;
      line-height: 1;
      white-space: nowrap;
    }
    .match-time-input { width: 122px !important; min-height: 40px !important; color: var(--warning) !important; font-weight: 800; }
    .versus { margin: 4px 0; text-align: center; color: var(--muted); font-weight: 900; }
    .match-team-list {
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, 112px);
      justify-content: center;
      gap: 14px;
      padding-top: 14px;
    }
    .match-team-list::before {
      content: "";
      position: absolute;
      top: 0;
      left: 56px;
      right: 56px;
      border-top: var(--tree-line) solid var(--line);
    }
    .match-team-list::after {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: var(--tree-line);
      height: 14px;
      background: var(--line);
      transform: translateX(-50%);
    }
    .match-team {
      position: relative;
      display: grid;
      place-items: center;
      width: 112px;
      height: 142px;
      padding: 9px;
      border: 3px solid var(--line);
      background: #ffffff;
      color: #111820;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.1;
      writing-mode: vertical-rl;
      text-orientation: upright;
      overflow: hidden;
    }
    .match-team::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -14px;
      width: var(--tree-line);
      height: 14px;
      background: var(--line);
      transform: translateX(-50%);
    }
    .match-team.is-long { font-size: 15px; }
    .match-team.is-very-long { font-size: 12px; }
    .match-team.is-source-label {
      font-size: 12px;
      white-space: nowrap;
    }
    .match-result {
      min-height: 18px;
      margin-top: 3px;
      color: var(--success);
      font-size: 12px;
      font-weight: 900;
      line-height: 1.15;
    }
    .tree-final .match-team { height: 70px; }
    .tree-semifinals .match-team { height: 104px; }
    .tree-qualifiers .match-team { height: 142px; }

    .tournament-tree.bracket-flat {
      min-width: 1120px;
      padding: 10px 20px 14px;
    }
    .bracket-canvas {
      position: relative;
      width: 1080px;
      height: 610px;
      margin: 0 auto;
      --bracket-box-width: 160px;
      --bracket-box-height: 170px;
      --bracket-team-font-size: 21px;
      --bracket-box-border-width: 3px;
      --bracket-line-width: 3px;
    }
    .bracket-lines {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 1080px;
      height: 610px;
      overflow: visible;
      pointer-events: none;
    }
    .bracket-line {
      fill: none;
      stroke: #111820;
      stroke-width: var(--bracket-line-width);
      stroke-linecap: square;
      stroke-linejoin: miter;
      vector-effect: non-scaling-stroke;
    }
    .bracket-line.is-winner {
      stroke: #d5223f;
      stroke-width: calc(var(--bracket-line-width) + 2px);
    }
    .bracket-champion {
      position: absolute;
      top: 0;
      left: 268px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 360px;
      height: 68px;
      padding: 6px 16px;
      border: var(--bracket-box-border-width) solid #111820;
      background: #ffffff;
      color: #111820;
      font-size: 30px;
      font-weight: 900;
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bracket-time {
      position: absolute;
      z-index: 3;
      display: grid;
      place-items: center;
      width: 144px;
      min-height: 38px;
      padding: 3px 10px;
      border: 2px solid #111820;
      background: #ffffff;
      color: #111820;
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      transform: translateX(-50%);
    }
    .bracket-team-row {
      position: absolute;
      top: 410px;
      left: 0;
      z-index: 3;
      width: 1080px;
      height: var(--bracket-box-height);
    }
    .bracket-team {
      position: absolute;
      top: 0;
      display: grid;
      place-items: center;
      width: var(--bracket-box-width);
      height: var(--bracket-box-height);
      padding: 10px 12px;
      border: 3px solid #111820;
      background: #ffffff;
      color: #111820;
      font-size: var(--bracket-team-font-size);
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
      white-space: normal;
      overflow: hidden;
      text-overflow: clip;
      transform: translateX(-50%);
    }
    .bracket-team-line {
      display: block;
      white-space: nowrap;
    }
    .bracket-team.is-long {
      font-size: max(14px, calc(var(--bracket-team-font-size) - 3px));
    }
    .bracket-team.is-very-long {
      font-size: max(12px, calc(var(--bracket-team-font-size) - 6px));
    }
    .bracket-canvas[data-team-orientation="horizontal"] .bracket-team {
      writing-mode: horizontal-tb;
      text-orientation: mixed;
      word-break: keep-all;
      overflow-wrap: normal;
    }
    .bracket-canvas[data-team-orientation="vertical"] .bracket-team {
      writing-mode: vertical-rl;
      text-orientation: upright;
      word-break: normal;
      overflow-wrap: normal;
    }
    .bracket-canvas[data-team-orientation="vertical"] .bracket-team-line {
      display: inline;
      white-space: nowrap;
    }
    .bracket-view-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(170px, 1fr));
      gap: 12px;
      margin: 12px 0 0;
      padding: 14px 16px;
      border-top: 1px solid var(--line);
    }
    .bracket-view-settings {
      margin: 0 0 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
    }
    .bracket-view-settings summary {
      min-height: 48px;
      padding: 13px 16px;
      color: var(--text);
      font-weight: 900;
      cursor: pointer;
    }
    .bracket-view-settings summary::marker { color: var(--accent-strong); }
    .bracket-view-options label {
      display: grid;
      gap: 5px;
      color: var(--text);
      font-weight: 800;
    }
    .bracket-view-options select,
    .bracket-view-options input { min-height: 42px; }
    .bracket-range {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 82px;
      align-items: center;
      gap: 8px;
    }
    .bracket-range input[type="number"] {
      width: 82px;
      min-height: 42px;
      padding: 8px 9px;
      color: var(--accent-strong);
      font-weight: 900;
      text-align: right;
    }

    .save-bar {
      position: sticky;
      bottom: 0;
      z-index: 15;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 22px max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, .97);
    }

    dialog {
      width: min(500px, calc(100vw - 28px));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      padding: 0;
    }

    dialog::backdrop { background: rgba(18, 39, 54, .65); }
    .dialog-body { padding: 22px; }
    .dialog-body h2 { margin: 0 0 10px; }
    .dialog-body p { color: var(--muted); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: rgba(217, 238, 251, .82);
      font-size: 22px;
      font-weight: 900;
    }
    .loading-overlay[hidden] { display: none; }

    body:not(.is-editing) .save-bar { display: none; }

    @media (min-width: 1000px) and (max-height: 820px) {
      body[data-active-view="tournament"]:not(.is-editing) .app-header {
        min-height: 48px;
        padding: 4px 18px;
      }
      body[data-active-view="tournament"]:not(.is-editing) .eyebrow,
      body[data-active-view="tournament"]:not(.is-editing) .status-band { display: none; }
      body[data-active-view="tournament"]:not(.is-editing) .section-heading {
        display: flex;
        min-height: 0;
        margin-bottom: 6px;
      }
      body[data-active-view="tournament"]:not(.is-editing) .section-heading > div:first-child { display: none; }
      body[data-active-view="tournament"]:not(.is-editing) .section-actions {
        width: 100%;
        justify-content: flex-end;
      }
      body[data-active-view="tournament"]:not(.is-editing) h1 { font-size: 22px; }
      body[data-active-view="tournament"]:not(.is-editing) .header-actions button {
        min-height: 38px;
        padding: 5px 13px;
      }
      body[data-active-view="tournament"]:not(.is-editing) .tabs { padding: 5px 18px 0; }
      body[data-active-view="tournament"]:not(.is-editing) .tab {
        min-height: 36px;
        padding: 4px 8px;
      }
      body[data-active-view="tournament"]:not(.is-editing) .workspace { padding: 5px 18px 8px; }
      body[data-active-view="tournament"]:not(.is-editing) .tournament-tree {
        min-width: 1120px;
        padding: 6px 26px 10px;
      }
      body[data-active-view="tournament"]:not(.is-editing) .bracket-canvas {
        transform: none;
        margin-bottom: 0;
      }
      body[data-active-view="tournament"]:not(.is-editing) .champion-banner {
        width: min(720px, 66%);
        margin-bottom: 18px;
        padding: 6px 14px;
      }
      body[data-active-view="tournament"]:not(.is-editing) .champion-banner::after {
        bottom: -18px;
        height: 18px;
      }
      body[data-active-view="tournament"]:not(.is-editing) .champion-name { font-size: 27px; }
      body[data-active-view="tournament"]:not(.is-editing) .tree-final {
        width: 280px;
        margin-bottom: 18px;
      }
      body[data-active-view="tournament"]:not(.is-editing) .tree-final::after {
        bottom: -18px;
        height: 18px;
      }
      body[data-active-view="tournament"]:not(.is-editing) .tree-semifinals {
        grid-template-columns: repeat(2, 280px);
        gap: 128px;
        margin: 0 7% 18px;
      }
      body[data-active-view="tournament"]:not(.is-editing) .tree-semifinals::before,
      body[data-active-view="tournament"]:not(.is-editing) .tree-semifinals > .match-card::before {
        top: -11px;
      }
      body[data-active-view="tournament"]:not(.is-editing) .tree-semifinals > .match-card::before { height: 11px; }
      body[data-active-view="tournament"]:not(.is-editing) .tree-semifinals > .match-card::after {
        bottom: -18px;
        height: 18px;
      }
      body[data-active-view="tournament"]:not(.is-editing) .tree-qualifiers {
        grid-template-columns: repeat(2, minmax(430px, 1fr));
        gap: 76px;
        margin: 0 3%;
      }
      body[data-active-view="tournament"]:not(.is-editing) .qualifier-branch {
        grid-template-columns: 112px 280px;
        gap: 14px;
      }
      body[data-active-view="tournament"]:not(.is-editing) .qualifier-branch::before {
        top: -10px;
        left: calc(50% - 126px);
        right: calc(50% - 126px);
      }

      body[data-active-view="tournament"]:not(.is-editing) .seed-card strong.is-very-long { font-size: 11px; }
      body[data-active-view="tournament"]:not(.is-editing) .match-head { min-height: 22px; }
      body[data-active-view="tournament"]:not(.is-editing) .match-time { font-size: 18px; }
      body[data-active-view="tournament"]:not(.is-editing) .match-team-list {
        grid-template-columns: repeat(2, 112px);

      body[data-active-view="tournament"]:not(.is-editing) .match-team-list::before {

      body[data-active-view="tournament"]:not(.is-editing) .match-team-list::after,
      body[data-active-view="tournament"]:not(.is-editing) .match-team::before {

      }

      body[data-active-view="tournament"]:not(.is-editing) .match-team {
        width: 112px;
        font-size: 17px;
        border-width: 3px;
      }
      body[data-active-view="tournament"]:not(.is-editing) .match-team.is-long { font-size: 14px; }
      body[data-active-view="tournament"]:not(.is-editing) .match-team.is-very-long { font-size: 11px; }
      body[data-active-view="tournament"]:not(.is-editing) .match-team.is-source-label { font-size: 12px; }
      body[data-active-view="tournament"]:not(.is-editing) .tree-final .match-team { height: 104px; }
      body[data-active-view="tournament"]:not(.is-editing) .tree-semifinals .match-team { height: 116px; }
      body[data-active-view="tournament"]:not(.is-editing) .tree-qualifiers .match-team { height: 132px; }
      body[data-active-view="tournament"]:not(.is-editing) .match-card.is-readonly .match-result {
        min-height: 14px;
        margin-top: 2px;
        font-size: 11px;
      }
    }

    @media (max-width: 980px) {
      .group-grid { grid-template-columns: 1fr; }
      .tournament-scroll { overflow-x: auto; }
      .tournament-tree { min-width: 1080px; }
      .group-row { grid-template-columns: 54px minmax(180px, 1fr) repeat(3, 70px); }
      .group-row .metric:nth-last-child(-n+2) { display: none; }
    }

    @media (max-width: 640px) {
      .app-header { position: static; align-items: flex-start; padding: 12px; }
      .header-actions { max-width: 150px; }
      .header-actions button { min-height: 42px; padding: 8px 10px; }
      .status-band { grid-template-columns: 1fr; padding: 10px 12px; }
      .tabs { padding: 12px 12px 0; }
      .tab { padding: 8px 6px; font-size: 14px; }
      .workspace { padding: 16px 12px 28px; }
      .section-heading { align-items: flex-start; flex-direction: column; }
      .section-actions { width: 100%; }
      .section-actions button { flex: 1 1 150px; }
      .group-row { grid-template-columns: 48px minmax(0, 1fr) 62px; }
      .group-row .metric { display: none; }
      .group-row .metric:first-of-type { display: block; }
      .save-bar { padding-left: 12px; padding-right: 12px; }
      .save-bar button { flex: 1; }
    }

    .tournament-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 12px;
      margin: 0 0 18px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
    }
    .tournament-options label {
      display: grid;
      gap: 5px;
      color: var(--text);
      font-weight: 800;
    }
    .tournament-options select { min-height: 42px; }
    .tournament-options .checkbox-label {
      display: flex;
      align-items: center;
      gap: 9px;
      align-self: end;
      min-height: 42px;
    }
    .tournament-options input[type="checkbox"] { width: 20px; height: 20px; }
    .display-schedule-block { margin-top: 28px; }
    .display-schedule-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .display-schedule-heading h3 { margin: 0; }
    .display-heading-copy {
      display: flex;
      align-items: center;
      gap: 22px;
      min-width: 0;
    }
    .display-clock-row {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin: 4px 0 10px;
    }
    .live-clock {
      display: inline-flex;
      align-items: center;
      min-width: 126px;
      color: #111820;
      font-size: clamp(30px, 3vw, 44px);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: 0;
      white-space: nowrap;
    }
    .display-schedule-table { min-width: 0 !important; }
    .display-schedule-table th,
    .display-schedule-table td { font-size: 16px; }
    .display-schedule-table td:nth-child(2) { white-space: nowrap; }
    .display-fullscreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      overflow: auto;
      padding: 18px 22px 28px;
      background: #dff3ff;
      color: #111820;
    }
    .display-fullscreen[hidden] { display: none; }
    .display-fullscreen-toolbar {
      display: grid;
      grid-template-columns: minmax(126px, auto) minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      max-width: 1280px;
      margin: 0 auto 10px;
    }
    .display-fullscreen-toolbar strong {
      justify-self: center;
      font-size: clamp(22px, 3vw, 38px);
    }
    .display-fullscreen-toolbar .live-clock {
      justify-self: start;
      font-size: clamp(36px, 3.6vw, 52px);
    }
    .display-fullscreen-body { max-width: 1280px; margin: 0 auto; }
    .display-fullscreen .tournament-tree { border-color: #111820; }
    .display-fullscreen .bracket-canvas {
      margin: 0 auto;
      transform: none !important;
      margin-bottom: 0 !important;
    }
    .display-fullscreen .display-schedule-table {
      width: 100%;
      background: #ffffff;
      border: 2px solid #111820;
    }
    .display-fullscreen .display-schedule-table th,
    .display-fullscreen .display-schedule-table td {
      color: #111820;
      border-color: #8aa9ba;
      padding: clamp(10px, 1.5vh, 17px) 16px;
      font-size: clamp(20px, 1.75vw, 27px);
      line-height: 1.25;
    }
    .display-fullscreen[data-kind="schedule"] .display-fullscreen-body {
      max-width: 1360px;
    }
    .bracket-line.is-third-place {
      stroke: #657a87;
      stroke-dasharray: 8 6;
      stroke-width: var(--bracket-line-width);
    }
    .bracket-third-place-label {
      position: absolute;
      z-index: 3;
      top: 236px;
      left: 50%;
      transform: translateX(-50%);
      padding: 3px 9px;
      border: 2px solid #657a87;
      background: #ffffff;
      color: #111820;
      font-size: 17px;
      font-weight: 900;
      white-space: nowrap;
    }
    html.is-display-fullscreen,
    html.is-display-fullscreen body { overflow: hidden; }
    @media (max-width: 720px) {
      .tournament-options { grid-template-columns: 1fr; }
      .bracket-view-options { grid-template-columns: 1fr; }
      .display-fullscreen { padding: 12px; }
      .display-fullscreen-toolbar {
        grid-template-columns: 1fr auto;
        align-items: flex-start;
      }
      .display-fullscreen-toolbar .live-clock { font-size: 30px; }
      .display-fullscreen-toolbar strong { font-size: 22px; }
      .display-fullscreen-toolbar strong { grid-column: 1 / -1; grid-row: 2; justify-self: start; }
      .display-heading-copy { align-items: flex-start; flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">WRO MIE / TOURNAMENT OPERATIONS</p>
        <h1>大会編成・進行管理</h1>
      </div>
      <div class="header-actions">
        <button id="refreshButton" class="secondary" type="button">更新</button>
        <button id="spreadsheetButton" class="secondary" type="button">スプレッドシート</button>
        <button id="editButton" class="primary" type="button">管理編集</button>
      </div>
    </header>

    <div class="status-band" aria-live="polite">
      <div id="statusMessage" class="status-message">大会情報を読み込んでいます。</div>
      <div id="updatedAt" class="updated-at"></div>
    </div>
    <div id="securityNotice" class="warning-banner" hidden></div>

    <nav class="tabs" aria-label="大会管理画面">
      <button class="tab" type="button" data-view="groups" aria-selected="true">グループ分け</button>
      <button class="tab" type="button" data-view="schedule" aria-selected="false">タイムスケジュール</button>
      <button class="tab" type="button" data-view="tournament" aria-selected="false">トーナメント</button>
    </nav>

    <main class="workspace">
      <section id="groupsView" class="view"></section>
      <section id="scheduleView" class="view" hidden></section>
      <section id="tournamentView" class="view" hidden></section>
    </main>

  <div class="save-bar">
      <button id="discardButton" class="secondary" type="button">再読込</button>
      <button id="saveButton" class="primary" type="button">変更を保存</button>
    </div>
  </div>

  <div id="displayFullscreen" class="display-fullscreen" hidden>
    <div class="display-fullscreen-toolbar">
      <time class="live-clock" data-live-clock datetime="">--:--</time>
      <strong id="displayFullscreenTitle"></strong>
      <button id="displayFullscreenClose" class="secondary" type="button">全画面解除</button>
    </div>
    <div id="displayFullscreenBody" class="display-fullscreen-body"></div>
  </div>

  <dialog id="editDialog">
    <form id="editForm" class="dialog-body" method="dialog">
      <h2>管理編集</h2>
      <p id="editDescription">編集キーを入力してください。</p>
      <label for="editorKey">編集キー</label>
      <input id="editorKey" type="password" autocomplete="current-password">
      <div class="dialog-actions">
        <button class="secondary" type="button" data-close-dialog>閉じる</button>
        <button class="primary" type="submit">編集を有効にする</button>
      </div>
    </form>
  </dialog>

  <div id="loadingOverlay" class="loading-overlay">処理中です...</div>

  <script>
    var appState = null;
    var editorKey = sessionStorage.getItem('mieTournamentEditorKey') || '';
    var activeView = 'groups';
    var isDirty = false;
    var editModeActive = false;
    var refreshInFlight = false;
    var realtimeRefreshTimer = null;
    var liveClockTimer = null;
    var lastStateSignature = '';
    var consecutiveRefreshFailures = 0;
    var REALTIME_REFRESH_MS = 10000;
    var BRACKET_DISPLAY_STORAGE_KEY = 'mieTournamentBracketDisplayV1';
    var BRACKET_DISPLAY_DEFAULTS = {
      orientation: 'horizontal',
      wrapMode: 'auto',
      fontSize: 21,
      boxWidth: 160,
      boxHeight: 170,
      boxBorderWidth: 3,
      lineWidth: 3
    };
    var bracketDisplaySettings = loadBracketDisplaySettings();
    var PLACEHOLDERS = [
      '未定', 'T-1 勝者', 'T-2 勝者', 'SF-1 勝者', 'SF-2 勝者',
      'SF-1 敗者', 'SF-2 敗者', '3P-1 勝者', '3P-1 敗者',
      'Aグループ1位', 'Bグループ1位'
    ];

    document.addEventListener('DOMContentLoaded', initialize);

    function initialize() {
      document.getElementById('refreshButton').addEventListener('click', function() { loadState(); });
      document.getElementById('discardButton').addEventListener('click', function() { loadState(); });
      document.getElementById('saveButton').addEventListener('click', saveState);
      document.getElementById('editButton').addEventListener('click', openEditDialog);
      document.getElementById('spreadsheetButton').addEventListener('click', openSpreadsheet);
      document.getElementById('displayFullscreenClose').addEventListener('click', closeDisplayFullscreen);
      document.getElementById('editForm').addEventListener('submit', submitEditorKey);
      document.querySelectorAll('[data-close-dialog]').forEach(function(button) {
        button.addEventListener('click', function() { document.getElementById('editDialog').close(); });
      });
      document.querySelectorAll('.tab').forEach(function(button) {
        button.addEventListener('click', function() {
          showView(button.dataset.view);
          refreshLiveResults();
        });
      });
      window.addEventListener('beforeunload', function(event) {
        if (!isDirty) return;
        event.preventDefault();
        event.returnValue = '';
      });
      document.addEventListener('fullscreenchange', handleFullscreenChange);
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
          updateLiveClocks();
          refreshLiveResults();
        }
      });
      startLiveClock();
      startRealtimeRefresh();
      loadState();
    }

    function callServer(method) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function(resolve, reject) {
        if (!window.google || !google.script || !google.script.run) {
          reject(new Error('Google Apps ScriptのWebアプリから開いてください。'));
          return;
        }
        var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function(error) {
          reject(new Error(error && error.message ? error.message : 'GASとの通信に失敗しました。'));
        });
        var serverMethod = runner[method];
        if (typeof serverMethod !== 'function') {
          reject(new Error('GASの処理「' + method + '」を呼び出せません。'));
          return;
        }
        serverMethod.apply(runner, args);
      });
    }

    async function loadState(options) {
      options = options && options.silent ? options : { silent: false };
      if (refreshInFlight) return;
      if (options.silent && (isEditing() || isDirty || document.hidden || !shouldRealtimeRefresh())) return;
      refreshInFlight = true;
      if (!options.silent) setLoading(true);
      try {
        var response = await callServer('getCompetitionState', editorKey);
        if (!response || !response.success) throw new Error(response && response.message || '大会情報を取得できませんでした。');
        var nextSignature = createStateSignature(response);
        var hasChanged = nextSignature !== lastStateSignature;
        setCompetitionState(response);
        lastStateSignature = nextSignature;
        consecutiveRefreshFailures = 0;
        if (!options.silent) isDirty = false;
        if (!options.silent || hasChanged) {
          render();
        } else {
          document.getElementById('updatedAt').textContent = appState.updatedAt ? '更新 ' + appState.updatedAt : '';
          updateLiveClocks();
        }
        if (!options.silent) {
          setStatus('閲覧表示です。管理編集が必要な場合は「管理編集」を押してください。', '');
        }
      } catch (error) {
        consecutiveRefreshFailures += 1;
        if (!options.silent || consecutiveRefreshFailures >= 3) {
          setStatus(options.silent
            ? '自動更新を確認できません。通信回復後に再試行します。'
            : error.message, options.silent ? 'warning' : 'error');
        }
      } finally {
        refreshInFlight = false;
        if (!options.silent) setLoading(false);
      }
    }

    function createStateSignature(state) {
      if (!state) return '';
      return JSON.stringify({
        teams: state.teams || [],
        groups: state.groups || [],
        standings: state.standings || [],
        schedule: state.schedule || [],
        tournamentMode: state.tournamentMode || '',
        thirdPlaceEnabled: Boolean(state.thirdPlaceEnabled),
        bracketDisplaySettings: state.bracketDisplaySettings || {}
      });
    }

    function shouldRealtimeRefresh() {
      var overlay = document.getElementById('displayFullscreen');
      return activeView === 'schedule' || activeView === 'tournament' || Boolean(overlay && !overlay.hidden);
    }

    function refreshLiveResults() {
      if (!appState || !shouldRealtimeRefresh()) return;
      loadState({ silent: true });
    }

    function startRealtimeRefresh() {
      if (realtimeRefreshTimer) window.clearInterval(realtimeRefreshTimer);
      realtimeRefreshTimer = window.setInterval(refreshLiveResults, REALTIME_REFRESH_MS);
    }

    function formatCurrentTime(date) {
      try {
        return new Intl.DateTimeFormat('ja-JP', {
          timeZone: 'Asia/Tokyo',
          hour: '2-digit',
          minute: '2-digit',
          hourCycle: 'h23'
        }).format(date);
      } catch (error) {
        return String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
      }
    }

    function updateLiveClocks() {
      var now = new Date();
      var label = formatCurrentTime(now);
      document.querySelectorAll('[data-live-clock]').forEach(function(clock) {
        clock.textContent = label;
        clock.dateTime = now.toISOString();
      });
    }

    function startLiveClock() {
      updateLiveClocks();
      if (liveClockTimer) window.clearInterval(liveClockTimer);
      liveClockTimer = window.setInterval(updateLiveClocks, 1000);
    }

    function createLiveClock() {
      var clock = document.createElement('time');
      clock.className = 'live-clock';
      clock.setAttribute('data-live-clock', '');
      clock.setAttribute('aria-label', '現在時刻');
      return clock;
    }

    function createLiveClockRow() {
      var row = document.createElement('div');
      row.className = 'display-clock-row';
      row.appendChild(createLiveClock());
      return row;
    }

    function render() {
      document.body.classList.toggle('is-editing', isEditing());
      document.getElementById('updatedAt').textContent = appState.updatedAt ? '更新 ' + appState.updatedAt : '';
      document.getElementById('editButton').textContent = isEditing() ? '編集を終了' : '管理編集';
      document.getElementById('saveButton').disabled = !isEditing();
      document.getElementById('discardButton').disabled = false;
      var notice = document.getElementById('securityNotice');
      notice.hidden = !appState.securityNotice || !isEditing();
      notice.textContent = appState.securityNotice || '';
      renderGroups();
      renderSchedule();
      renderTournament();
      showView(activeView);
      refreshDisplayFullscreenBody();
      updateLiveClocks();
    }

    function renderGroups() {
      var container = document.getElementById('groupsView');
      container.textContent = '';
      container.appendChild(createSectionHeading('グループ分け', '6チームを3チームずつに分け、A1〜A3・B1〜B3を割り当てます。', [
        createButton('ランダムに組み分け', 'success', randomizeGroups, !isEditing())
      ]));
      var help = document.createElement('p');
      help.className = 'group-help';
      help.textContent = '各グループ内で総当たりを行います。順位1位がトーナメントのシードです。必要ならチーム欄を直接変更できます。';
      container.appendChild(help);

      var grid = document.createElement('div');
      grid.className = 'group-grid';
      ['A', 'B'].forEach(function(groupId) {
        var panel = document.createElement('article');
        panel.className = 'group-panel';
        var title = document.createElement('h3');
        title.textContent = groupId + 'グループ';
        panel.appendChild(title);
        appState.groups.filter(function(row) { return row.group === groupId; }).forEach(function(group) {
          panel.appendChild(createGroupRow(group));
        });
        grid.appendChild(panel);
      });
      container.appendChild(grid);
    }

    function createGroupRow(group) {
      var standing = appState.standings.find(function(row) { return row.id === group.id; }) || {};
      var row = document.createElement('div');
      row.className = 'group-row';

      var id = document.createElement('div');
      id.className = 'group-id';
      id.textContent = group.id;
      row.appendChild(id);

      var select = createTeamSelect(group.team, false);
      select.disabled = !isEditing();
      select.setAttribute('aria-label', group.id + 'のチーム');
      select.addEventListener('change', function() {
        group.team = select.value;
        syncGroupSchedule();
        markDirty();
        renderGroups();
      });
      row.appendChild(select);

      row.appendChild(createMetric('勝ち点', standing.points || 0));
      row.appendChild(createMetric('得点', standing.score || 0));
      row.appendChild(createMetric('紫', standing.purple || 0));
      row.appendChild(createMetric('違反', standing.violations || 0));
      row.appendChild(createMetric('順位', standing.rank ? standing.rank + '位' : '-', standing.seed ? 'seed' : ''));
      return row;
    }

    function renderSchedule() {
      var container = document.getElementById('scheduleView');
      container.textContent = '';
      container.appendChild(createSectionHeading('タイムスケジュール', '全試合はAコートで実施します。開始時間と対戦枠は手動で変更できます。', []));

      var wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      var table = document.createElement('table');
      table.innerHTML = '<thead><tr><th>試合ID</th><th>区分</th><th>開始時間</th><th>チーム1</th><th>チーム2</th><th>結果</th><th>メモ</th></tr></thead>';
      var body = document.createElement('tbody');
      appState.schedule.filter(isVisibleScheduleMatch).forEach(function(match) {
        body.appendChild(createScheduleRow(match));
      });
      table.appendChild(body);
      wrap.appendChild(table);
      container.appendChild(wrap);

      var displayBlock = document.createElement('section');
      displayBlock.className = 'display-schedule-block';
      var displayHeading = document.createElement('div');
      displayHeading.className = 'display-schedule-heading';
      var displayHeadingCopy = document.createElement('div');
      displayHeadingCopy.className = 'display-heading-copy';
      displayHeadingCopy.appendChild(createLiveClock());
      var displayTitle = document.createElement('h3');
      displayTitle.textContent = '表示用タイムスケジュール';
      displayHeadingCopy.appendChild(displayTitle);
      displayHeading.appendChild(displayHeadingCopy);
      displayHeading.appendChild(createButton('全画面表示', 'secondary', function() {
        openDisplayFullscreen('schedule');
      }, false));
      displayBlock.appendChild(displayHeading);
      displayBlock.appendChild(createDisplayScheduleTable());
      container.appendChild(displayBlock);
    }

    function isVisibleScheduleMatch(match) {
      return Boolean(match) && (appState.thirdPlaceEnabled || match.id !== '3P-1');
    }

    function createDisplayScheduleTable() {
      var wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      var table = document.createElement('table');
      table.className = 'display-schedule-table';
      table.innerHTML = '<thead><tr><th>区分</th><th>開始時間</th><th>チーム1</th><th>チーム2</th></tr></thead>';
      var body = document.createElement('tbody');
      appState.schedule.filter(isVisibleScheduleMatch).forEach(function(match) {
        var row = document.createElement('tr');
        appendTextCell(row, match.phase || match.id);
        appendTextCell(row, match.startTime || '--:--');
        appendTextCell(row, displayBracketSlot(match.team1));
        appendTextCell(row, displayBracketSlot(match.team2));
        body.appendChild(row);
      });
      table.appendChild(body);
      wrap.appendChild(table);
      return wrap;
    }

    function createScheduleRow(match) {
      var row = document.createElement('tr');
      appendTextCell(row, match.id, 'match-id');
      appendTextCell(row, match.phase, 'phase');

      var timeCell = document.createElement('td');
      timeCell.className = 'time';
      var time = document.createElement('input');
      time.type = 'time';
      time.value = normalizeTime(match.startTime);
      time.disabled = !isEditing();

    function clampNumber(value, minimum, maximum, fallback) {
      var number = Number(value);
      if (!Number.isFinite(number)) return fallback;
      return Math.min(maximum, Math.max(minimum, number));
    }

    function loadBracketDisplaySettings(source) {
      var saved = source && typeof source === 'object' ? source : {};
      try {
        if (!source) {
          saved = JSON.parse(localStorage.getItem(BRACKET_DISPLAY_STORAGE_KEY) || '{}') || {};
        }
      } catch (error) {
        saved = {};
      }
      return {
        orientation: saved.orientation === 'vertical' ? 'vertical' : 'horizontal',
        wrapMode: ['auto', '6', '8', '10', 'none'].indexOf(String(saved.wrapMode || '')) >= 0
          ? String(saved.wrapMode)
          : BRACKET_DISPLAY_DEFAULTS.wrapMode,
        fontSize: clampNumber(saved.fontSize, 14, 30, BRACKET_DISPLAY_DEFAULTS.fontSize),
        boxWidth: clampNumber(saved.boxWidth, 120, 176, BRACKET_DISPLAY_DEFAULTS.boxWidth),
        boxHeight: clampNumber(saved.boxHeight, 110, 190, BRACKET_DISPLAY_DEFAULTS.boxHeight),
        boxBorderWidth: clampNumber(saved.boxBorderWidth, 1, 7, BRACKET_DISPLAY_DEFAULTS.boxBorderWidth),
        lineWidth: clampNumber(saved.lineWidth, 2, 7, BRACKET_DISPLAY_DEFAULTS.lineWidth)
      };
    }

    function saveBracketDisplaySettings() {
      try {
        localStorage.setItem(BRACKET_DISPLAY_STORAGE_KEY, JSON.stringify(bracketDisplaySettings));
      } catch (error) {}
    }

    function setCompetitionState(response) {
      appState = response;
      bracketDisplaySettings = loadBracketDisplaySettings(response && response.bracketDisplaySettings);
      if (appState) {
        appState.bracketDisplaySettings = Object.assign({}, bracketDisplaySettings);
      }
      saveBracketDisplaySettings();
    }

    function updateBracketDisplayDraft() {
      if (appState) {

    function createBracketSettingRange(title, key, minimum, maximum, step, suffix) {
      var label = document.createElement('label');
      label.appendChild(document.createTextNode(title));
      var row = document.createElement('div');
      row.className = 'bracket-range';
      var input = document.createElement('input');
      input.type = 'range';
      input.min = minimum;
      input.max = maximum;
      input.step = step;
      input.value = bracketDisplaySettings[key];
      var numberInput = document.createElement('input');
      numberInput.type = 'number';

      numberInput.max = maximum;
      numberInput.step = step;
      numberInput.value = bracketDisplaySettings[key];
      numberInput.setAttribute('aria-label', title + 'の数値');

        var normalized = clampNumber(value, minimum, maximum, bracketDisplaySettings[key]);
        bracketDisplaySettings[key] = normalized;
        input.value = normalized;
        numberInput.value = normalized;
        updateBracketDisplayDraft();
        applyBracketDisplaySettingsToCanvases();

            bracketDisplaySettings.boxBorderWidth + 'px / 接続線 ' + bracketDisplaySettings.lineWidth + 'px）';
        }
      }
      input.addEventListener('input', function() { updateValue(input.value); });
      numberInput.addEventListener('change', function() { updateValue(numberInput.value); });
      row.appendChild(input);
      row.appendChild(numberInput);
      label.appendChild(row);
      return label;
    }

        appendBracketPath(svg, 'M356 350 V245 H218', isSameTeam(semifinal1Winner, firstRoundRightWinner));

    function findSeedTeam(group, fallback) {
      var standing = appState.standings.find(function(row) {
        return row.seed && row.group === group;
      });
      return standing && standing.team ? standing.team : fallback;
    }

    function getResolvedWinner(match, trail) {
      if (!match || !match.winner || match.winner === '未定') return '';
      return resolveBracketSlot(match.winner, trail || {});
    }

    function getResolvedLoser(match, trail) {
      if (!match) return '';
      var winner = getResolvedWinner(match, trail || {});
      var first = displayBracketSlot(match.team1, trail || {});
      var second = displayBracketSlot(match.team2, trail || {});
      if (!winner || winner === '引き分け') return '';
      if (isSameTeam(winner, first)) return second;
      if (isSameTeam(winner, second)) return first;
      return '';
    }

    function resolveBracketSlot(value, trail) {
      var text = String(value || '').trim();
      var match = text.match(/^(.+?) (勝者|敗者)$/);
      if (!match) return text;
      var key = match[1] + '|' + match[2];
      if (trail[key]) return text;
      var source = findScheduleMatch(match[1]);
      if (!source) return text;
      trail[key] = true;
      var result = match[2] === '勝者'
        ? getResolvedWinner(source, trail)
        : getResolvedLoser(source, trail);
      delete trail[key];
      return result || text;
    }

    function displayBracketSlot(value, trail) {
      var text = resolveBracketSlot(value, trail || {});
      return text || '未定';
    }

    function isSameTeam(left, right) {
      return Boolean(left && right && String(left).trim() === String(right).trim());
    }

    function appendBracketPath(svg, pathData, isWinner, isThirdPlace) {
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', pathData);
      path.setAttribute('class', 'bracket-line' + (isWinner ? ' is-winner' : '') + (isThirdPlace ? ' is-third-place' : ''));
      svg.appendChild(path);
    }

    function createBracketTime(match, centerX, top) {
      var time = document.createElement('div');
      time.className = 'bracket-time';
      time.style.left = centerX + 'px';
      time.style.top = top + 'px';
      time.textContent = match && match.startTime ? match.startTime : '--:--';
      time.title = (match ? getTournamentPhaseLabel(match) : '試合') + ' ' + time.textContent;
      time.setAttribute('aria-label', time.title);
      return time;
    }

    function setBracketTeamName(element, text) {
      var value = String(text || '未定').trim() || '未定';
      var compactValue = value.replace(/[\s\u3000]+/g, '');
      var length = Array.from(compactValue).length;
      var lines = getBracketTeamNameLines(value);
      element.textContent = '';
      lines.forEach(function(line, index) {
        var span = document.createElement('span');
        span.className = 'bracket-team-line';
        span.textContent = line;
        element.appendChild(span);
      });
      element.title = value;
      element.setAttribute('aria-label', value);
      element.classList.toggle('is-long', length > 10);
      element.classList.toggle('is-very-long', length > 16);
    }

    function getBracketTeamNameLines(value) {
      if (bracketDisplaySettings.orientation === 'vertical') {
        return [value.replace(/[\s\u3000]+/g, '') || '未定'];
      }
      if (bracketDisplaySettings.wrapMode === 'none') return [value];

      var maximum = bracketDisplaySettings.wrapMode === 'auto'
        ? 10
        : Number(bracketDisplaySettings.wrapMode) || 10;
      var words = value.split(/[\s\u3000]+/).filter(Boolean);
      if (!words.length) return ['未定'];

      var lines = [];
      words.forEach(function(word) {
        var characters = Array.from(word);
        if (characters.length <= maximum) {
          lines.push(word);
          return;
        }
        for (var index = 0; index < characters.length; index += maximum) {
          lines.push(characters.slice(index, index + maximum).join(''));
        }
      });
      return lines;
    }

    function getTournamentPhaseLabel(match) {
      if (!match) return '';
      if (match.id === 'F-1') return '決勝';
      if (match.id === '3P-1') return '3位決定戦';
      if (match.id.indexOf('SF-') === 0) return '準決勝 ' + match.id.slice(3);
      if (match.id.indexOf('T-') === 0) return '1回戦 ' + match.id.slice(2);
      return match.phase || match.id;
    }

      var automatic = document.createElement('option');

        var tree = document.createElement('div');
        tree.className = 'tournament-tree bracket-flat';
        tree.appendChild(createFlatBracket());
        body.appendChild(tree);
      } else {
        body.appendChild(createDisplayScheduleTable());
      }
      updateLiveClocks();
    }

    function refreshDisplayFullscreenBody() {
      var overlay = document.getElementById('displayFullscreen');
      if (!overlay || overlay.hidden || !overlay.dataset.kind) return;
      renderDisplayFullscreenBody(overlay.dataset.kind);
    }

    function openDisplayFullscreen(kind) {
      var overlay = document.getElementById('displayFullscreen');
      var title = document.getElementById('displayFullscreenTitle');
      if (!overlay || !title || !appState) return;
      overlay.dataset.kind = kind;
      title.textContent = kind === 'tournament' ? '決勝トーナメント' : 'タイムスケジュール';
      renderDisplayFullscreenBody(kind);
      overlay.hidden = false;
      document.documentElement.classList.add('is-display-fullscreen');
      updateLiveClocks();
      var request = overlay.requestFullscreen || overlay.webkitRequestFullscreen;
      if (request) {
        var promise = request.call(overlay);
        if (promise && promise.catch) promise.catch(function() {});
      }
    }

    function closeDisplayFullscreen() {
      var overlay = document.getElementById('displayFullscreen');
      var body = document.getElementById('displayFullscreenBody');
      if (overlay) overlay.hidden = true;
      if (overlay) delete overlay.dataset.kind;
      if (body) body.textContent = '';
      document.documentElement.classList.remove('is-display-fullscreen');
      if (document.fullscreenElement && document.exitFullscreen) {
        var promise = document.exitFullscreen();
        if (promise && promise.catch) promise.catch(function() {});
      }
    }

    function handleFullscreenChange() {
      var overlay = document.getElementById('displayFullscreen');
      if (!document.fullscreenElement && overlay && !overlay.hidden) {
        closeDisplayFullscreen();
      }
    }

    function showView(view) {
      activeView = view;
      document.body.dataset.activeView = view;
      ['groups', 'schedule', 'tournament'].forEach(function(name) {
        document.getElementById(name + 'View').hidden = name !== view;
      });
      document.querySelectorAll('.tab').forEach(function(button) {
        button.setAttribute('aria-selected', String(button.dataset.view === view));
      });
    }

    function syncGroupSchedule() {
      var assignments = {};
      appState.groups.forEach(function(group) { assignments[group.id] = group.team; });
      var pairs = {
        'A-1': ['A1', 'A2'], 'A-2': ['A2', 'A3'], 'A-3': ['A3', 'A1'],
        'B-1': ['B1', 'B2'], 'B-2': ['B2', 'B3'], 'B-3': ['B3', 'B1']
      };
      appState.schedule.forEach(function(match) {
        if (!pairs[match.id]) return;
        match.team1 = assignments[pairs[match.id][0]] || '';
        match.team2 = assignments[pairs[match.id][1]] || '';
        match.winner = '';
        match.winnerOverride = '';
      });
    }

    async function randomizeGroups() {
      if (!confirm('6チームをランダムにA・Bグループへ分けます。現在の組分けを変更しますか？')) return;
      setLoading(true);
      try {
        var response = await callServer('randomizeGroups', editorKey);
        if (!response || !response.success) throw new Error(response && response.message || '組分けに失敗しました。');
        setCompetitionState(response);
        isDirty = false;
        render();
        setStatus('グループ分けを更新しました。', 'success');
      } catch (error) { setStatus(error.message, 'error'); }
      finally { setLoading(false); }
    }

    async function applyRecommendedBracket() {
      if (!confirm('現在のグループ順位から初期トーナメント配置を作成します。手動変更中の対戦枠は上書きされます。')) return;
      setLoading(true);
      try {
        var response = await callServer(
          'applyRecommendedBracket',
          editorKey,
          appState.tournamentMode,
          Boolean(appState.thirdPlaceEnabled)
        );
        if (!response || !response.success) throw new Error(response && response.message || '初期配置を作成できませんでした。');
        setCompetitionState(response);
        isDirty = false;
        render();
        showView('tournament');
        setStatus('順位から初期トーナメント配置を作成しました。必要に応じて手動変更できます。', 'success');
      } catch (error) { setStatus(error.message, 'error'); }
      finally { setLoading(false); }
    }

    async function saveState() {
      if (!appState || !isEditing()) return;
      if (!confirm('グループ・時刻・トーナメント枠の変更を保存しますか？')) return;
      setLoading(true);
      try {
        var payload = {
          groups: appState.groups,
          schedule: appState.schedule,
          tournamentMode: appState.tournamentMode,
          thirdPlaceEnabled: Boolean(appState.thirdPlaceEnabled),
          bracketDisplaySettings: Object.assign({}, bracketDisplaySettings)
        };
        var response = await callServer('saveCompetitionState', payload, editorKey);
        if (!response || !response.success) throw new Error(response && response.message || '保存に失敗しました。');
        setCompetitionState(response);
        isDirty = false;
        render();
        setStatus('大会編成を保存しました。', 'success');
      } catch (error) { setStatus(error.message, 'error'); }
      finally { setLoading(false); }
    }

    function openEditDialog() {
      if (!appState) return;
      if (isEditing()) {
        if (isDirty && !confirm('未保存の変更があります。編集を終了しますか？')) return;
        editModeActive = false;
        render();
        setStatus('閲覧表示に戻りました。', '');
        return;
      }
      if (!appState.editorKeyRequired) {
        editModeActive = true;
        render();
        setStatus('編集キーが未設定のため、編集モードを有効にしました。', 'warning');
        return;
      }
      document.getElementById('editorKey').value = editorKey;
      document.getElementById('editDialog').showModal();
    }

    async function submitEditorKey(event) {
      event.preventDefault();
      var candidate = document.getElementById('editorKey').value;
      setLoading(true);
      try {
        var response = await callServer('authorizeEditor', candidate);
        if (!response || !response.success) throw new Error(response && response.message || '編集キーを確認できませんでした。');
        editorKey = candidate;
        sessionStorage.setItem('mieTournamentEditorKey', editorKey);
        document.getElementById('editDialog').close();
        editModeActive = true;
        await loadState();
      } catch (error) { setStatus(error.message, 'error'); }
      finally { setLoading(false); }
    }

    function openSpreadsheet() {
      if (!appState || !appState.spreadsheetUrl) return;
      window.open(appState.spreadsheetUrl, '_blank', 'noopener');
    }

    function markDirty() {
      isDirty = true;
      setStatus('未保存の変更があります。', 'warning');
    }

    function isEditing() {
      return Boolean(appState && appState.canEdit && editModeActive);
    }

    function setStatus(message, type) {
      var element = document.getElementById('statusMessage');
      element.className = 'status-message ' + (type || '');
      element.textContent = message;
    }

    function setLoading(loading) {
      document.getElementById('loadingOverlay').hidden = !loading;
    }

    function normalizeTime(value) {
      var match = String(value || '').match(/(\d{1,2}):(\d{2})/);
      if (!match) return '';
      return String(match[1]).padStart(2, '0') + ':' + match[2];
    }

    function unique(values) {
      return values.filter(function(value, index) { return values.indexOf(value) === index; });
    }
  </script>
</body>
</html>
