<style>
    :root {
      --bg: #dceffc;
      --surface: #ffffff;
      --surface-strong: #f3f9fd;
      --line: #2d4252;
      --line-soft: #9ec8e2;
      --text: #111820;
      --muted: #4d6271;
      --accent: #268dcc;
      --accent-strong: #1478b5;
      --success: #157347;
      --warning: #9a5b00;
      --danger: #c62836;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    html { color-scheme: light; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "BIZ UDPGothic", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
      letter-spacing: 0;
      -webkit-text-size-adjust: 100%;
    }

    button, input, select { font: inherit; letter-spacing: 0; }

    button, select, input[type="time"], input[type="text"], input[type="password"], input[type="number"] {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-strong);
      color: var(--text);
    }

    button {
      padding: 10px 18px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled { opacity: .48; cursor: not-allowed; }
    button.primary { background: var(--accent-strong); border-color: var(--accent); color: #ffffff; }
    button.success { background: var(--success); border-color: var(--success); color: #ffffff; }
    button.secondary { background: var(--surface); }
    button.danger { background: var(--danger); border-color: var(--danger); color: #ffffff; }

    select, input[type="time"], input[type="text"], input[type="password"], input[type="number"] {
      width: 100%;
      padding: 9px 12px;
    }

    .shell { width: min(1480px, 100%); margin: 0 auto; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 66px;
      padding: 9px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .97);
    }

    .eyebrow { margin: 0 0 4px; color: var(--accent); font-size: 12px; font-weight: 900; }
    .title-row { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
    h1 { margin: 0; font-size: clamp(22px, 3vw, 34px); }
    .app-version { flex: 0 0 auto; color: var(--muted); font-size: 12px; font-weight: 900; white-space: nowrap; }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

    .status-band {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 8px 20px;
      border-bottom: 1px solid var(--line);
      background: #eef8ff;
    }

    .status-message { min-width: 0; color: var(--muted); font-weight: 700; }
    .status-message.success { color: var(--success); }
    .status-message.error { color: var(--danger); }
    .status-message.warning { color: var(--warning); }
    .updated-at { color: var(--muted); white-space: nowrap; font-size: 13px; }

    .warning-banner {
      margin: 14px 22px 0;
      padding: 12px 14px;
      border: 1px solid #a66e14;
      border-radius: var(--radius);
      background: #fff4dd;
      color: #694100;
      font-weight: 700;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 10px 20px 0;
    }

    .tab { background: var(--surface); }
    .tab[aria-selected="true"] { background: var(--accent-strong); border-color: var(--accent); color: #ffffff; }
    body.viewer-mode .tabs { grid-template-columns: repeat(4, 1fr); }

    .workspace { padding: 12px 20px 24px; }
    .view[hidden] { display: none; }

    .section-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 10px;
    }

    .section-heading h2 { margin: 0; font-size: clamp(22px, 3vw, 31px); }
    .section-heading p { margin: 5px 0 0; color: var(--muted); }
    .section-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

    .group-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .group-grid.single-league { grid-template-columns: 1fr; }
    .group-panel { border-top: 4px solid var(--accent); padding-top: 12px; min-width: 0; }
    .group-panel h3 { margin: 0 0 10px; font-size: 23px; }
    .group-help { margin: 0 0 12px; color: var(--muted); font-size: 14px; }

    .group-row {
      display: grid;
      grid-template-columns: 58px minmax(180px, 1fr) repeat(5, minmax(62px, auto));
      align-items: center;
      gap: 8px;
      min-height: 68px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }

    .group-id { font-size: 20px; font-weight: 900; color: var(--accent); }
    .metric { text-align: center; min-width: 0; }
    .metric-label { display: block; color: var(--muted); font-size: 11px; }
    .metric-value { display: block; margin-top: 3px; font-size: 17px; font-weight: 900; }
    .metric[hidden] { display: none !important; }
    .seed { color: var(--success); }

    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; min-width: 980px; }
    th, td { padding: 11px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th { background: var(--surface); color: var(--muted); font-size: 13px; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    td.match-id { width: 76px; color: var(--accent); font-weight: 900; white-space: nowrap; }
    td.phase { width: 176px; font-weight: 800; }
    td.time { width: 130px; }
    td.winner { min-width: 140px; color: var(--success); font-weight: 800; }
    td.winner select { min-width: 150px; }
    .configuration-bar { display: flex; align-items: end; gap: 10px; flex-wrap: wrap; margin: 0 0 16px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .configuration-bar label { display: grid; gap: 5px; min-width: 150px; color: var(--muted); font-size: 13px; font-weight: 800; }
    .configuration-bar input { min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius); }
    .schedule-row[draggable="true"] { cursor: grab; }
    .schedule-row.dragging { opacity: .35; }
    .drag-handle { width: 42px; text-align: center; font-size: 22px; user-select: none; }
    .row-actions { display: flex; gap: 6px; width: 210px; }
    .row-actions button { min-height: 40px; padding: 7px 10px; }
    .generic-bracket { position: relative; display: flex; align-items: stretch; gap: 84px; min-width: max-content; padding: 28px 36px 44px; background: #cfe8f8; }
    .generic-round { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: space-around; gap: 28px; min-width: max(210px, var(--bracket-box-width, 160px)); }
    .generic-round h3 { margin: 0 0 4px; text-align: center; font-size: 15px; }
    .generic-card { width: var(--bracket-box-width, 160px); min-height: 72px; margin-inline: auto; padding: 8px 10px; border: var(--bracket-box-border-width, 2px) solid #111820; border-radius: 6px; background: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.14); }
    .generic-card { position: relative; }
    .generic-card strong { display: block; margin-bottom: 5px; color: var(--accent-strong); }
    .generic-match-meta { font-size: var(--bracket-meta-font-size, 12px); text-align: var(--bracket-meta-align, left); }
    .generic-bracket[data-show-match-id="false"] .generic-match-id { display: none; }
    .generic-match-meta span + span::before { content: "  "; white-space: pre; }
    .generic-slot { position: relative; display: block; min-height: 24px; padding: 2px 0; border-top: 1px solid #b8cbd8; font-size: var(--bracket-team-font-size, 21px); font-weight: 900; line-height: 1.2; overflow-wrap: anywhere; }
    .generic-slot:first-of-type { border-top: 0; }
    .generic-bracket[data-team-orientation="horizontal"] .generic-slot { writing-mode: horizontal-tb; text-orientation: mixed; }
    .generic-bracket[data-team-orientation="vertical"] .generic-card { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--bracket-box-height, 170px); }
    .generic-bracket[data-team-orientation="vertical"] .generic-card strong { align-self: flex-start; min-width: 42px; writing-mode: horizontal-tb; }
    .generic-bracket[data-team-orientation="vertical"] .generic-slot { width: 42px; height: calc(var(--bracket-box-height, 170px) - 24px); min-height: 0; padding: 5px 7px; border-top: 0; border-left: 1px solid #b8cbd8; writing-mode: vertical-rl; text-orientation: upright; white-space: nowrap; overflow: hidden; }
    .generic-bracket[data-team-orientation="vertical"] .generic-slot:first-of-type { border-left: 0; }
    .generic-bracket-lines { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
    .generic-bracket-lines path { fill: none; stroke: #111820; stroke-width: var(--tree-line, 3px); stroke-linecap: square; stroke-linejoin: miter; }
    .generic-bracket-lines .line-halo { stroke: #cfe8f8; stroke-width: calc(var(--tree-line, 3px) + 7px); }
    .generic-bracket.is-connection-editing .generic-bracket-lines { pointer-events: auto; }
    .generic-bracket.is-connection-editing .generic-bracket-lines .connection-path { pointer-events: none; }
    .generic-bracket.is-connection-editing .generic-bracket-lines .connection-hit-area { fill: none; stroke: transparent; stroke-width: 20px; pointer-events: stroke; cursor: grab; touch-action: none; }
    .generic-bracket.is-connection-editing .generic-bracket-lines .connection-path.is-hovered,
    .generic-bracket.is-connection-editing .generic-bracket-lines .connection-path.is-adjusting { stroke: #d77900; stroke-width: calc(var(--tree-line, 3px) + 2px); }
    .connection-port, .connection-clear { display: none; position: absolute; z-index: 5; width: 22px; height: 22px; min-height: 0; padding: 0; border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 11px; line-height: 18px; box-shadow: 0 0 0 2px #0a5f91; }
    .generic-bracket.is-connection-editing .connection-port,
    .generic-bracket.is-connection-editing .connection-clear { display: grid; place-items: center; }
    .connection-source { right: -13px; background: #0a5f91; cursor: grab; }
    .connection-source.is-winner-port { top: 28%; }
    .connection-source.is-loser-port { top: 64%; background: #7252a3; box-shadow: 0 0 0 2px #7252a3; }
    .connection-target { left: -13px; top: 50%; transform: translateY(-50%); background: #16845b; box-shadow: 0 0 0 2px #16845b; cursor: crosshair; }
    .connection-clear { right: -13px; top: 50%; transform: translateY(-50%); background: #b51f36; box-shadow: 0 0 0 2px #b51f36; cursor: pointer; }
    .connection-port.is-selected { outline: 4px solid #ffbf00; outline-offset: 2px; }
    .line-adjust-handle { fill: #ffbf00; stroke: #111820; stroke-width: 2px; pointer-events: all; cursor: ew-resize; touch-action: none; }
    .generic-bracket[data-layout-direction="bottom-up"] .line-adjust-handle { cursor: ns-resize; }
    .generic-bracket[data-layout-direction="bottom-up"] .connection-source { top: -13px; right: auto; }
    .generic-bracket[data-layout-direction="bottom-up"] .connection-source.is-winner-port { left: 36%; }
    .generic-bracket[data-layout-direction="bottom-up"] .connection-source.is-loser-port { left: 58%; }
    .generic-bracket[data-layout-direction="bottom-up"] .generic-slot { position: static; }
    .generic-bracket[data-layout-direction="bottom-up"] .connection-target { top: auto; bottom: -13px; transform: translateX(-50%); }
    .generic-bracket[data-layout-direction="bottom-up"] .generic-slot[data-field="team1"] .connection-target { left: 35%; }
    .generic-bracket[data-layout-direction="bottom-up"] .generic-slot[data-field="team2"] .connection-target { left: 65%; }
    .generic-bracket[data-layout-direction="bottom-up"] .connection-clear { top: auto; bottom: -13px; transform: none; }
    .generic-bracket[data-layout-direction="bottom-up"] .generic-slot[data-field="team1"] .connection-clear { right: auto; left: 8%; }
    .generic-bracket[data-layout-direction="bottom-up"] .generic-slot[data-field="team2"] .connection-clear { right: 8%; }
    .connection-mode-help { margin: 10px 0; padding: 10px 12px; border-radius: 9px; background: #fff4d6; color: #654700; font-weight: 800; }
    .seed-settings { margin: 12px 0; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
    .seed-settings > summary { cursor: pointer; font-weight: 900; }
    .seed-row { display: grid; grid-template-columns: 90px minmax(170px, 1fr) minmax(150px, 1fr) 130px; gap: 10px; align-items: end; margin-top: 10px; }
    @media (max-width: 900px) { .seed-row { grid-template-columns: 1fr 1fr; } }
    .generic-bracket[data-layout-direction="bottom-up"] { flex-direction: column-reverse; gap: 72px; min-width: 1080px; width: 100%; }
    .generic-bracket[data-layout-direction="bottom-up"] .generic-round { flex-direction: row; align-items: flex-start; justify-content: space-around; gap: 24px; min-height: calc(var(--bracket-box-height, 170px) + 42px); min-width: 0; width: 100%; }
    .generic-bracket[data-layout-direction="bottom-up"] .generic-round h3 { position: absolute; left: 0; right: 0; top: -24px; }
    .generic-bracket.is-classic-bottom-up { gap: var(--classic-round-gap, 74px); padding: 54px 46px 76px; background: var(--classic-background, #cfe8f8); }
    .generic-bracket.is-classic-bottom-up .generic-round { min-height: 118px; }
    .generic-bracket.is-classic-bottom-up .generic-round h3 { display: none; }
    .generic-bracket.is-classic-bottom-up .generic-card { border-color: #606060; border-radius: 2px; box-shadow: none; }
    .generic-bracket.is-classic-bottom-up .seed-round { min-height: var(--classic-seed-height, 320px); }
    .generic-bracket.is-classic-bottom-up .seed-card { display: grid; place-items: center; width: var(--classic-seed-width, 112px); min-height: var(--classic-seed-height, 320px); text-align: center; }
    .generic-bracket.is-classic-bottom-up .seed-card strong { display: none; }
    .generic-bracket.is-classic-bottom-up .seed-card .generic-slot { width: auto; height: calc(var(--classic-seed-height, 320px) - 28px); min-height: 0; padding: 8px 5px; border: 0; writing-mode: vertical-rl; text-orientation: upright; white-space: normal; overflow: hidden; font-size: max(22px, var(--bracket-team-font-size, 21px)); line-height: 1.25; }
    .generic-bracket.is-classic-bottom-up .match-card { display: grid; place-items: center; width: var(--classic-match-width, 154px); min-height: var(--classic-match-height, 88px); padding: 8px 12px; }
    .generic-bracket.is-classic-bottom-up .match-card .generic-match-meta { display: grid; gap: 4px; width: 100%; margin: 0; color: #111; text-align: center; }
    .generic-bracket.is-classic-bottom-up .match-card .generic-match-meta span + span::before { content: none; }
    .generic-bracket.is-classic-bottom-up .match-card .generic-match-court { display: block; color: #111; font-size: 20px; font-weight: 700; }
    .generic-bracket.is-classic-bottom-up .match-card .generic-matchup { display: none; }
    .generic-bracket.is-classic-bottom-up .match-card .generic-match-time { color: #111; font-size: 22px; font-weight: 500; }
    .generic-bracket.is-classic-bottom-up .match-card > .generic-slot { position: static; width: 0; height: 0; min-height: 0; padding: 0; border: 0; overflow: visible; color: transparent; font-size: 0; }
    .generic-bracket.is-classic-bottom-up .champion-card { display: grid; place-items: center; width: min(var(--classic-champion-width, 980px), 82vw); min-height: var(--classic-champion-height, 110px); text-align: center; }
    .generic-bracket.is-classic-bottom-up .champion-card strong { color: #111; font-size: 30px; }
    .generic-bracket.is-classic-bottom-up .champion-card .generic-slot { border: 0; font-size: clamp(26px, 2.5vw, 40px); font-weight: 500; }
    .generic-bracket.is-classic-bottom-up .generic-bracket-lines path,
    .generic-bracket.is-classic-bottom-up .generic-bracket-lines .connection-path.is-winner-path { stroke: #111820; stroke-width: var(--tree-line, 3px); }
    .generic-bracket.is-classic-bottom-up .generic-bracket-lines .line-halo { stroke: var(--classic-background, #cfe8f8); stroke-width: calc(var(--tree-line, 3px) + 7px); }
    .generic-bracket.is-classic-bottom-up .connection-source.is-winner-port { left: 50%; transform: translateX(-50%); }
    .generic-bracket.is-classic-bottom-up .champion-card .connection-target { left: 50%; }
    .generic-matchup { display: none; }
    .generic-bracket.is-detailed-bottom-up { gap: 92px; padding: 54px 46px 76px; background: #fff; }
    .generic-bracket.is-detailed-bottom-up .generic-round h3 { display: none; }
    .generic-bracket.is-detailed-bottom-up .seed-card { display: grid; align-content: center; width: max(145px, var(--bracket-box-width, 160px)); min-height: max(145px, var(--bracket-box-height, 170px)); text-align: center; }
    .generic-bracket.is-detailed-bottom-up .seed-card .generic-slot { border: 0; writing-mode: horizontal-tb; text-orientation: mixed; font-size: var(--bracket-team-font-size, 21px); }
    .generic-bracket.is-detailed-bottom-up .match-card { display: grid; place-items: center; width: max(220px, var(--bracket-box-width, 160px)); min-height: 108px; padding: 9px 14px; }
    .generic-bracket.is-detailed-bottom-up .match-card .generic-match-meta { display: grid; gap: 4px; width: 100%; margin: 0; text-align: center; }
    .generic-bracket.is-detailed-bottom-up .match-card .generic-match-meta span + span::before { content: none; }
    .generic-bracket.is-detailed-bottom-up .match-card .generic-match-court { color: #0875b5; font-size: 14px; }
    .generic-bracket.is-detailed-bottom-up .match-card .generic-matchup { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 7px; align-items: center; font-size: max(17px, var(--bracket-meta-font-size, 12px)); }
    .generic-bracket.is-detailed-bottom-up .match-card .generic-matchup span { overflow-wrap: anywhere; }
    .generic-bracket.is-detailed-bottom-up .match-card .generic-matchup b { color: #606060; font-size: 13px; }
    .generic-bracket.is-detailed-bottom-up .match-card .generic-match-time { color: #333; font-size: 14px; }
    .generic-bracket.is-detailed-bottom-up .match-card > .generic-slot { position: static; width: 0; height: 0; min-height: 0; padding: 0; border: 0; overflow: visible; color: transparent; font-size: 0; }
    .generic-bracket.is-detailed-bottom-up .champion-card { display: grid; place-items: center; width: min(720px, 82vw); min-height: 150px; text-align: center; }
    .generic-bracket.is-detailed-bottom-up .champion-card strong { font-size: 38px; }
    .generic-bracket.is-detailed-bottom-up .champion-card .generic-slot { border: 0; font-size: clamp(28px, 3vw, 48px); }
    .generic-bracket.is-detailed-bottom-up .connection-source.is-winner-port { left: 50%; transform: translateX(-50%); }
    .generic-bracket.is-detailed-bottom-up .generic-bracket-lines .line-halo { stroke: #fff; }

    .tournament-scroll {
      overflow-x: auto;
      overscroll-behavior-x: contain;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      background: #cfe8f8;
    }

    .tournament-tree {
      --tree-line: 3px;
      --line: #111820;
      min-width: 1080px;
      padding: 12px 28px 16px;
      color: #111820;
    }

    .champion-banner {
      position: relative;
      width: min(720px, 66%);
      margin: 0 auto 20px;
      padding: 9px 18px;
      border: 3px solid var(--line);
      background: #ffffff;
      text-align: center;
    }
    .champion-banner::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -20px;
      width: var(--tree-line);
      height: 20px;
      background: var(--line);
      transform: translateX(-50%);
    }
    .champion-name {
      display: block;
      font-size: clamp(24px, 2.5vw, 34px);
      font-weight: 900;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .tree-level-title {
      position: relative;
      z-index: 3;
      width: max-content;
      margin: 0 auto 4px;
      padding: 0 12px;
      background: #cfe8f8;
      color: #223746;
      text-align: center;
      font-size: 14px;
      font-weight: 900;
    }

    .tree-final {
      position: relative;
      width: 260px;
      margin: 0 auto 24px;
    }
    .tree-final::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -24px;
      width: var(--tree-line);
      height: 24px;
      background: var(--line);
      transform: translateX(-50%);
    }

    .tree-semifinals {
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, 260px);
      justify-content: space-around;
      gap: 120px;
      margin: 0 7% 24px;
    }
    .tree-semifinals::before {
      content: "";
      position: absolute;
      top: -14px;
      left: calc(25% - 1px);
      right: calc(25% - 1px);
      border-top: var(--tree-line) solid var(--line);
    }
    .tree-semifinals > .match-card::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -14px;
      width: var(--tree-line);
      height: 14px;
      background: var(--line);
      transform: translateX(-50%);
    }
    .tree-semifinals > .match-card::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -24px;
      width: var(--tree-line);
      height: 24px;
      background: var(--line);
      transform: translateX(-50%);
    }

    .tree-qualifiers {
      display: grid;
      grid-template-columns: repeat(2, minmax(420px, 1fr));
      gap: 96px;
      margin: 0 3%;
    }
    .qualifier-branch {
      position: relative;
      display: grid;
      grid-template-columns: 118px 260px;
      justify-content: center;
      gap: 18px;
      align-items: end;
    }
    .qualifier-branch::before {
      content: "";
      position: absolute;
      top: -14px;
      left: calc(50% - 125px);
      right: calc(50% - 125px);
      border-top: var(--tree-line) solid var(--line);
    }
    .qualifier-branch::after {
      content: "";
      position: absolute;
      left: 50%;
      top: -24px;
      width: var(--tree-line);
      height: 10px;
      background: var(--line);
      transform: translateX(-50%);
    }
    .qualifier-branch > .seed-card::before,
    .qualifier-branch > .match-card::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -14px;
      width: var(--tree-line);
      height: 14px;
