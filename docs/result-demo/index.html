<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061014">
  <meta name="color-scheme" content="dark">
  <title>GAME RESULT | CHAN-PON vs POISON</title>
  <style>
    :root {
      --bg: #061014;
      --text: #dcfcff;
      --muted: #82adb3;
      --line: rgba(220,252,255,.22);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      font-family: "Arial Narrow", "Roboto Condensed", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .stage {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: max(28px, env(safe-area-inset-top)) max(22px, calc(env(safe-area-inset-right) + 18px)) max(34px, env(safe-area-inset-bottom)) max(22px, calc(env(safe-area-inset-left) + 18px));
      background:
        radial-gradient(80% 55% at 84% 8%, rgba(46,126,139,.23), transparent 62%),
        radial-gradient(75% 70% at 0% 100%, rgba(24,75,84,.19), transparent 62%),
        linear-gradient(145deg, #0a1a1f 0%, var(--bg) 68%);
    }

    .stage::before {
      content: "";
      position: absolute;
      z-index: -2;
      inset: 0;
      opacity: .15;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, transparent 0, transparent 3px, rgba(220,252,255,.12) 4px);
    }

    .stage::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 74vmax;
      aspect-ratio: 1;
      right: -50vmax;
      top: -46vmax;
      border: 1px solid rgba(220,252,255,.07);
      border-radius: 50%;
      box-shadow: 0 0 0 12vmax rgba(220,252,255,.016), 0 0 0 24vmax rgba(220,252,255,.01);
      pointer-events: none;
    }

    .card {
      width: min(100%, 720px);
      transform: translateY(-1.5svh);
    }

    .reveal {
      --delay: 0ms;
      position: relative;
      width: fit-content;
      max-width: 100%;
      margin: 0;
    }

    .reveal > span {
      display: block;
      opacity: 0;
      clip-path: inset(0 100% 0 0);
      transform: translate3d(-4px,0,0);
      filter: blur(2px);
      will-change: clip-path, opacity, transform, filter;
    }

    .reveal::before,
    .reveal::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: -.08em;
      bottom: -.08em;
      left: 0;
      opacity: 0;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .reveal::before {
      width: clamp(30px, 13vw, 92px);
      background: repeating-linear-gradient(135deg, rgba(220,252,255,.9) 0, rgba(220,252,255,.9) 2px, transparent 2px, transparent 6px);
      mix-blend-mode: screen;
      transform: translateX(-140%);
    }

    .reveal::after {
      width: 2px;
      background: rgba(220,252,255,.75);
      box-shadow: 0 0 15px rgba(220,252,255,.55);
      transform: translateX(-20px);
    }

    .playing .reveal > span {
      animation: text-in 620ms cubic-bezier(.16,.82,.18,1) var(--delay) both, glitch 220ms steps(2,end) calc(var(--delay) + 420ms) both;
    }

    .playing .reveal::before {
      animation: hatch 680ms cubic-bezier(.16,.82,.18,1) var(--delay) both;
    }

    .playing .reveal::after {
      animation: edge 640ms cubic-bezier(.16,.82,.18,1) var(--delay) both;
    }

    @keyframes text-in {
      0% { opacity: 0; clip-path: inset(0 100% 0 0); transform: translate3d(-4px,0,0); filter: blur(2px); }
      14% { opacity: 1; }
      100% { opacity: 1; clip-path: inset(0 0 0 0); transform: translate3d(0,0,0); filter: blur(0); }
    }

    @keyframes hatch {
      0% { opacity: 0; transform: translateX(-140%); }
      14% { opacity: .95; }
      72% { opacity: .88; }
      100% { opacity: 0; transform: translateX(calc(var(--travel) + 18px)); }
    }

    @keyframes edge {
      0% { opacity: 0; transform: translateX(-20px); }
      12% { opacity: .95; }
      84% { opacity: .65; }
      100% { opacity: 0; transform: translateX(var(--travel)); }
    }

    @keyframes glitch {
      0%,100% { translate: 0 0; text-shadow: none; }
      35% { translate: -1px 0; text-shadow: 3px 0 rgba(220,252,255,.24); }
      68% { translate: 1px 0; text-shadow: -2px 0 rgba(220,252,255,.2); }
    }

    .eyebrow {
      color: var(--muted);
      font-size: clamp(.66rem, 2.55vw, .9rem);
      font-weight: 900;
      letter-spacing: .15em;
      line-height: 1.2;
    }

    .title {
      margin-top: 6px;
      font-size: clamp(3rem, 14.5vw, 7rem);
      font-weight: 1000;
      letter-spacing: -.058em;
      line-height: .84;
    }

    .divider {
      width: min(100%, 650px);
      height: 1px;
      margin: clamp(19px, 5vw, 30px) 0 clamp(17px, 4.5vw, 26px);
      overflow: hidden;
    }

    .divider::after {
      content: "";
      display: block;
      width: 100%;
      height: 1px;
      opacity: 0;
      transform: scaleX(0);
      transform-origin: left;
      background: linear-gradient(90deg, var(--line), rgba(220,252,255,.03));
    }

    .playing .divider::after {
      animation: divider-in 560ms cubic-bezier(.16,.82,.18,1) 610ms both;
    }

    @keyframes divider-in {
      to { opacity: 1; transform: scaleX(1); }
    }

    .meta,
    .result-label {
      color: var(--muted);
      font-size: clamp(.65rem, 2.7vw, .88rem);
      font-weight: 950;
      letter-spacing: .14em;
      line-height: 1.2;
    }

    .matchup {
      margin-top: clamp(8px, 2.2vw, 13px);
      font-size: clamp(1.22rem, 6vw, 2.35rem);
      font-weight: 950;
      letter-spacing: -.025em;
      line-height: 1.18;
      overflow-wrap: anywhere;
    }

    .score {
      margin-top: clamp(18px, 5vw, 30px);
      font-size: clamp(4.8rem, 25vw, 10.5rem);
      font-weight: 1000;
      letter-spacing: -.075em;
      line-height: .78;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .score .vs {
      display: inline-block;
      margin-inline: .22em .2em;
      color: var(--muted);
      font-size: .19em;
      font-weight: 950;
      letter-spacing: .08em;
      vertical-align: .28em;
    }

    .result-label {
      margin-top: clamp(31px, 7vw, 48px);
    }

    .outcome {
      margin-top: 6px;
      font-size: clamp(2.35rem, 11.5vw, 5.3rem);
      font-weight: 1000;
      letter-spacing: -.05em;
      line-height: 1;
    }

    .replay {
      position: fixed;
      z-index: 10;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      min-width: 90px;
      min-height: 46px;
      padding: 10px 17px;
      border: 1px solid rgba(220,252,255,.31);
      border-radius: 999px;
      color: rgba(220,252,255,.9);
      background: rgba(5,13,16,.64);
      box-shadow: 0 8px 30px rgba(0,0,0,.22);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .12em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .replay:active { transform: scale(.95); }
    .replay:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

    .hint {
      position: fixed;
      z-index: 9;
      left: max(16px, env(safe-area-inset-left));
      bottom: max(28px, calc(env(safe-area-inset-bottom) + 6px));
      margin: 0;
      color: rgba(220,252,255,.35);
      font-size: .64rem;
      font-weight: 700;
      letter-spacing: .06em;
      pointer-events: none;
    }

    @media (max-width: 360px) {
      .stage { padding-inline: max(18px, calc(env(safe-area-inset-left) + 14px)); }
      .title { font-size: clamp(2.75rem, 14vw, 3.2rem); }
      .score { font-size: clamp(4.2rem, 24vw, 5.3rem); }
    }

    @media (orientation: landscape) and (max-height: 560px) {
      .stage { place-items: start; padding-top: max(18px, env(safe-area-inset-top)); }
      .card { width: min(88vw, 760px); margin-left: max(4vw, env(safe-area-inset-left)); transform: none; }
      .title { font-size: clamp(2.55rem, 8vw, 4.5rem); }
      .divider { margin-block: 12px; }
      .matchup { margin-top: 5px; font-size: clamp(1rem, 3.2vw, 1.7rem); }
      .score { margin-top: 12px; font-size: clamp(3.55rem, 11vw, 6.3rem); }
      .result-label { margin-top: 18px; }
      .outcome { font-size: clamp(2rem, 6vw, 3.4rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      .playing .reveal > span,
      .playing .reveal::before,
      .playing .reveal::after,
      .playing .divider::after { animation: none; }
      .reveal > span { opacity: 1; clip-path: none; transform: none; filter: none; }
      .reveal::before, .reveal::after { display: none; }
      .divider::after { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="試合結果">
    <section class="card">
      <p class="reveal eyebrow" data-delay="90"><span>ROBO SPORTS / MATCH RESULT</span></p>
      <h1 class="reveal title" data-delay="220"><span>GAME RESULT</span></h1>
      <div class="divider" aria-hidden="true"></div>
      <p class="reveal meta" data-delay="700"><span>MATCH COMPLETE</span></p>
      <p class="reveal matchup" data-delay="840"><span>CHAN-PON　対　POISON</span></p>
      <p class="reveal score" data-delay="1070" aria-label="1 対 1"><span><b>1</b><i class="vs">VS</i><b>1</b></span></p>
      <p class="reveal result-label" data-delay="1370"><span>DRAW</span></p>
      <p class="reveal outcome" data-delay="1490"><span>引き分け</span></p>
    </section>
  </main>

  <p class="hint">画面タップでも再生</p>
  <button class="replay" id="replay" type="button" aria-label="演出をもう一度再生">REPLAY</button>

  <script>
    const stage = document.getElementById('stage');
    const replay = document.getElementById('replay');
    const lines = [...document.querySelectorAll('.reveal')];

    function prepare(line) {
      const delay = Number(line.dataset.delay || 0);
      const width = Math.max(line.getBoundingClientRect().width, 40);
      line.style.setProperty('--delay', `${delay}ms`);
      line.style.setProperty('--travel', `${Math.ceil(width + 12)}px`);
    }

    function play() {
      stage.classList.remove('playing');
      void stage.offsetWidth;
      lines.forEach(prepare);
      stage.classList.add('playing');
    }

    replay.addEventListener('click', event => {
      event.stopPropagation();
      play();
    });
    stage.addEventListener('click', play);
    window.addEventListener('resize', () => lines.forEach(prepare), { passive: true });
    window.addEventListener('orientationchange', () => setTimeout(play, 180), { passive: true });
    window.addEventListener('pageshow', () => setTimeout(play, 160));
  </script>
</body>
</html>
