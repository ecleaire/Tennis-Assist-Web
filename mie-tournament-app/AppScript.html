<script>
    var appState = null;
    var editorKey = '';
    var viewerMode = false;
    var viewerToken = '';
    var viewerSignature = '';
    var activeView = 'groups';
    var isDirty = false;
    var editModeActive = false;
    var refreshInFlight = false;
    var versionCheckInFlight = false;
    var loginInFlight = false;
    var sessionReauthInProgress = false;
    var teamListDirty = false;
    var teamSyncHoldTimer = null;
    var groupSyncHoldTimer = null;
    var realtimeRefreshTimer = null;
    var liveClockTimer = null;
    var lastStateSignature = '';
    var consecutiveRefreshFailures = 0;
    var tournamentCountInputTimer = null;
    var rankingPolicyOpen = { preliminary: false, tournament: false };
    var teamListEditorOpen = false;
    var masterViewerAccounts = null;
    var masterViewerLoading = false;
    var masterAuditRows = null;
    var masterAuditLoading = false;
    var REALTIME_REFRESH_MS = 10000;
    var VIEWER_REFRESH_MS = 3000;
    var BRACKET_DISPLAY_STORAGE_KEY = 'mieTournamentBracketDisplayV1';
    var DRAFT_CACHE_PREFIX = 'tournamentDraftV1:';
    var DRAFT_CACHE_MAX_AGE_MS = 30 * 24 * 60 * 60 * 1000;
    var BRACKET_DISPLAY_DEFAULTS = {
      layoutDirection: 'left-to-right',
      orientation: 'horizontal',
      wrapMode: 'auto',
      fontSize: 21,
      boxWidth: 160,
      boxHeight: 170,
      boxBorderWidth: 3,
      lineWidth: 3,
      showMatchId: false,
      matchInfoFontSize: 12,
      matchInfoPosition: 'left',
      bottomUpStyle: 'classic',
      classicSeedWidth: 112,
      classicSeedHeight: 320,
      classicMatchWidth: 154,
      classicMatchHeight: 88,
      classicChampionWidth: 980,
      classicChampionHeight: 110,
      classicRoundGap: 74,
      classicBackground: '#cfe8f8'
    };
    var bracketDisplaySettings = loadBracketDisplaySettings();
    var scheduleDisplaySettings = null;
    var scheduleDisplaySettingsOpen = false;
    var undoHistory = [];
    var undoBaselineAvailable = true;
    var bracketConnectionMode = false;
    var pendingBracketConnection = null;
    var bracketOptionsOpen = false;
    var RANKING_POLICY_DEFAULTS = {
      preliminary: [{ key: 'points', direction: 'desc' }, { key: 'violations', direction: 'asc' }, { key: 'score', direction: 'asc' }, { key: 'purple', direction: 'desc' }],
      tournament: [{ key: 'points', direction: 'desc' }, { key: 'violations', direction: 'asc' }, { key: 'score', direction: 'asc' }, { key: 'purple', direction: 'desc' }]
    };
    var SCHEDULE_DISPLAY_COLUMNS = [
      { key: 'phase', label: '区分', defaultWidth: 180 },
      { key: 'startTime', label: '開始時間', defaultWidth: 110 },
      { key: 'endTime', label: '終了時間', defaultWidth: 110 },
      { key: 'court', label: 'コート', defaultWidth: 110 },
      { key: 'team1', label: 'チーム1', defaultWidth: 240 },
      { key: 'team2', label: 'チーム2', defaultWidth: 240 }
    ];
    var PLACEHOLDERS = [
      '未定', 'T-1 勝者', 'T-2 勝者', 'SF-1 勝者', 'SF-2 勝者',
      'SF-1 敗者', 'SF-2 敗者', '3P-1 勝者', '3P-1 敗者',
      'Aグループ1位', 'Bグループ1位'
    ];

    document.addEventListener('DOMContentLoaded', initialize);

    function initialize() {
      cleanupExpiredDraftCaches();
      viewerMode = document.body.dataset.viewerMode === 'true';
      viewerToken = document.body.dataset.viewerToken || '';
      viewerSignature = document.body.dataset.viewerSignature || '';
      document.getElementById('refreshButton').addEventListener('click', reloadFromServer);
      document.getElementById('discardButton').addEventListener('click', reloadFromServer);
      document.getElementById('undoButton').addEventListener('click', undoLastChange);
      document.getElementById('helpButton').addEventListener('click', function() {
        var guide = document.getElementById('quickGuide');
        guide.open = true;
        guide.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      document.getElementById('viewerButton').addEventListener('click', function() {
        openViewerShareDialog();
      });
      document.getElementById('viewerShareClose').addEventListener('click', function() { document.getElementById('viewerShareDialog').close(); });
      document.getElementById('viewerUrlOpen').addEventListener('click', function() { if (appState && appState.viewerUrl) window.open(appState.viewerUrl, '_blank', 'noopener'); });
      document.getElementById('viewerUrlCopy').addEventListener('click', copyViewerUrl);
      document.getElementById('viewerUrlRotate').addEventListener('click', rotateViewerUrl);
      document.getElementById('viewerQrSave').addEventListener('click', saveViewerQrImage);
      document.getElementById('saveButton').addEventListener('click', saveState);
      document.getElementById('editButton').addEventListener('click', openEditDialog);
      document.getElementById('spreadsheetButton').addEventListener('click', openSpreadsheet);
      document.getElementById('clearDraftButton').addEventListener('click', clearDraftAndReload);
      document.getElementById('displayFullscreenClose').addEventListener('click', closeDisplayFullscreen);
      document.getElementById('editForm').addEventListener('submit', submitEditorKey);
      document.getElementById('teamSyncCancel').addEventListener('click', closeTeamSyncDialog);
      document.getElementById('teamSyncNext').addEventListener('click', showFinalTeamSyncConfirmation);
      var teamSyncHold = document.getElementById('teamSyncHold');
      teamSyncHold.addEventListener('pointerdown', startTeamSyncHold);
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(function(eventName) { teamSyncHold.addEventListener(eventName, cancelTeamSyncHold); });
      teamSyncHold.addEventListener('click', function(event) { event.preventDefault(); });
      document.getElementById('groupSyncCancel').addEventListener('click', closeGroupSyncDialog);
      var groupSyncHold = document.getElementById('groupSyncHold');
      groupSyncHold.addEventListener('pointerdown', startGroupSyncHold);
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(function(eventName) { groupSyncHold.addEventListener(eventName, cancelGroupSyncHold); });
      groupSyncHold.addEventListener('click', function(event) { event.preventDefault(); });
      document.getElementById('editDialog').addEventListener('cancel', function(event) {
        if (event.currentTarget.dataset.forceLogin === 'true') event.preventDefault();
      });
      document.querySelectorAll('[data-close-dialog]').forEach(function(button) {
        button.addEventListener('click', function() { document.getElementById('editDialog').close(); });
      });
      document.querySelectorAll('.tab').forEach(function(button) {
        button.addEventListener('click', function() {
          showView(button.dataset.view);
          refreshLiveResults();
        });
      });
      window.addEventListener('beforeunload', function(event) {
        if (!isDirty) return;
        saveDraftCache();
        event.preventDefault();
        event.returnValue = '';
      });
      window.addEventListener('offline', function() {
        if (isDirty) saveDraftCache();
        setStatus('ネット接続が切れています。変更はこの端末へ保存済みです。', 'warning');
      });
      window.addEventListener('online', function() {
        setStatus(isDirty
          ? 'ネット接続が戻りました。端末保存中の変更は「変更を保存」で確定できます。'
          : 'ネット接続が戻りました。', isDirty ? 'warning' : 'success');
      });
      window.addEventListener('resize', redrawVisibleBracketLines);
      document.addEventListener('fullscreenchange', handleFullscreenChange);
      document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
          updateLiveClocks();
          refreshLiveResults();
        }
      });
      startLiveClock();
      startRealtimeRefresh();
      if (viewerMode) {
        configureViewerMode();
        setStatus('大会情報を読み込んでいます。', '');
        loadState();
        return;
      }
      sessionStorage.removeItem('tournamentAdminPassword');
      openEditDialog(true);
      setStatus('管理者パスワードでログインしてください。', 'warning');
    }

    function callServer(method) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function(resolve, reject) {
        if (!window.google || !google.script || !google.script.run) {
          reject(new Error('Google Apps ScriptのWebアプリから開いてください。'));
          return;
        }
        var runner = google.script.run.withSuccessHandler(function(response) {
          if (response && response.success === false && isEditorSessionError(response.message)) handleExpiredEditorSession(response.message);
          resolve(response);
        }).withFailureHandler(function(error) {
          var message = error && error.message ? error.message : 'GASとの通信に失敗しました。';
          if (isEditorSessionError(message)) handleExpiredEditorSession(message);
          reject(new Error(message));
        });
        var serverMethod = runner[method];
        if (typeof serverMethod !== 'function') {
          reject(new Error('GASの処理「' + method + '」を呼び出せません。'));
          return;
        }
        serverMethod.apply(runner, args);
      });
    }

    function isEditorSessionError(message) {
      return /編集セッション(?:を確認できません|の有効期限が切れました)/.test(String(message || ''));
    }

    function handleExpiredEditorSession(message) {
      if (viewerMode || sessionReauthInProgress) return;
      sessionReauthInProgress = true;
      if (isDirty) saveDraftCache();
      editorKey = '';
      editModeActive = false;
      if (appState) render();
      var dialog = document.getElementById('editDialog');
      if (!dialog.open) openEditDialog(true);
      setStatus(message || '編集セッションの有効期限が切れました。もう一度ログインしてください。端末保存中の変更はログイン後に復元できます。', 'warning');
    }

    async function loadState(options) {
      options = options && options.silent ? options : { silent: false };
      if (refreshInFlight) return;
      if (options.silent && (isEditing() || isDirty || document.hidden || !shouldRealtimeRefresh())) return;
      refreshInFlight = true;
      if (!options.silent) setLoading(true);
      try {
        var response = viewerMode ? await callServer('getPublicCompetitionState', viewerToken, viewerSignature) : await callServer('getCompetitionState', editorKey);
        if (!response || !response.success) throw new Error(response && response.message || '大会情報を取得できませんでした。');
        var nextSignature = createStateSignature(response);
        var hasChanged = !appState || nextSignature !== lastStateSignature;
        consecutiveRefreshFailures = 0;
        if (!hasChanged && options.silent) {
          updateLiveClocks();
          return;
        }
        setCompetitionState(response);
        lastStateSignature = nextSignature;
        if (!options.silent) isDirty = false;
        if (!options.silent || hasChanged) {
          render();
        } else {
          document.getElementById('updatedAt').textContent = appState.updatedAt ? '更新 ' + appState.updatedAt : '';
          updateLiveClocks();
        }
        if (!options.silent) {
          setStatus(viewerMode ? '大会情報を表示しています。内容は自動更新されます。' : '閲覧表示です。管理編集が必要な場合は「管理編集」を押してください。', '');
        }
      } catch (error) {
        consecutiveRefreshFailures += 1;
        if (!viewerMode && !appState && !options.silent) openEditDialog(true);
        if (!options.silent || consecutiveRefreshFailures >= 3) {
          setStatus(options.silent
            ? '自動更新を確認できません。通信回復後に再試行します。'
            : error.message, options.silent ? 'warning' : 'error');
        }
      } finally {
        refreshInFlight = false;
        if (!options.silent) setLoading(false);
      }
    }

    function reloadFromServer() {
      if (isDirty && !confirm('端末に一時保存した未確定の変更を破棄して、保存済みデータを再読込しますか？')) return;
      clearDraftCache();
      isDirty = false;
      teamListDirty = false;
      loadState();
    }

    function createStateSignature(state) {
      if (!state) return '';
      return JSON.stringify({
        teams: state.teams || [],
        teamList: state.teamList || [],
        groups: state.groups || [],
        standings: state.standings || [],
        schedule: state.schedule || [],
        groupCount: state.groupCount || 1,
        teamsPerGroup: state.teamsPerGroup || 1,
        groupSizes: state.groupSizes || [],
        tournamentParticipantCount: state.tournamentParticipantCount || 2,
        qualifiersPerGroup: state.qualifiersPerGroup || 1,
        tournamentParticipants: state.tournamentParticipants || [],
        seedSlots: state.seedSlots || [],
        courtCount: state.courtCount || 1,
        courtCountManual: Boolean(state.courtCountManual),
        rankingPolicies: state.rankingPolicies || {},
        thirdPlaceEnabled: Boolean(state.thirdPlaceEnabled),
        bracketDisplaySettings: state.bracketDisplaySettings || {},
        scheduleDisplaySettings: state.scheduleDisplaySettings || {},
        isMaster: Boolean(state.isMaster),
        updatedAt: state.updatedAt || '',
        serverRevision: state.serverRevision || ''
      });
    }

    function shouldRealtimeRefresh() {
      var overlay = document.getElementById('displayFullscreen');
      return viewerMode || activeView === 'schedule' || activeView === 'tournament' || Boolean(overlay && !overlay.hidden);
    }

    function configureViewerMode() {
      document.body.classList.add('viewer-mode');
      document.querySelector('.header-actions').hidden = true;
      document.querySelector('.save-bar').hidden = true;
      document.getElementById('editDialog').remove();
      var guide = document.getElementById('quickGuide');
      guide.open = false;
      guide.querySelector('summary').textContent = '大会情報の見方';
      guide.querySelector('ol').innerHTML = '<li><strong>グループ分け</strong><br>予選グループと順位を確認できます。</li><li><strong>タイムスケジュール</strong><br>試合時刻・コート・対戦相手を確認できます。</li><li><strong>試合結果</strong><br>メインアプリや大会管理者が更新した結果は、この表示にも自動反映されます。</li><li><strong>勝ち点の付与基準</strong><br>1ゲーム（3マッチ）ごとに、勝利3点・引き分けは両チーム1点ずつ・敗北0点です。まず3マッチの勝利数で判定します。決勝トーナメント・4位決定リーグ・優勝決定リーグで勝利数が同じ場合は、違反数が少ない→得点が少ない→紫が多い順に勝者を判定し、すべて同じ場合は引き分けです。</li><li><strong>競技ルール</strong><br>競技ルールについては<a href="https://drive.google.com/file/d/1JMmggxMfSWABUcA5sbM9U3qffb-ZMb2U/view?usp=sharing" target="_blank" rel="noopener">Japan決勝大会ルール</a>をご覧ください。</li><li><strong>トーナメント</strong><br>勝ち上がりと次の対戦を確認できます。</li><li><strong>リンク</strong><br>公式資料と、この大会専用ページのURL・QRコードを確認できます。</li>';
      var saveGuide = guide.querySelector('.save-guide'); if (saveGuide) saveGuide.hidden = true;
      document.querySelector('h1').textContent = '大会情報・進行状況';
    }

    async function refreshLiveResults() {
      if (!appState || !shouldRealtimeRefresh()) return;
      if (viewerMode && !refreshInFlight) {
        if (versionCheckInFlight) return;
        versionCheckInFlight = true;
        try {
          var version = await callServer('getPublicCompetitionVersion', viewerToken, viewerSignature);
          if (version && version.success && version.serverRevision === appState.serverRevision) {
            if (version.updatedAt) { appState.updatedAt = version.updatedAt; document.getElementById('updatedAt').textContent = '更新 ' + version.updatedAt; }
            return;
          }
        } catch (error) {}
        finally { versionCheckInFlight = false; }
      }
      loadState({ silent: true });
    }

    function startRealtimeRefresh() {
      if (realtimeRefreshTimer) window.clearInterval(realtimeRefreshTimer);
      realtimeRefreshTimer = window.setInterval(refreshLiveResults, viewerMode ? VIEWER_REFRESH_MS : REALTIME_REFRESH_MS);
    }

    function openViewerShareDialog() {
      if (!appState || !appState.viewerUrl) { setStatus('表示専用URLを発行できません。先に大会情報を読み込んでください。', 'error'); return; }
      document.getElementById('viewerShareDescription').textContent = (appState.accountLabel || 'この大会') + '専用です。他大会へ切り替える機能はありません。';
      document.getElementById('viewerUrlInput').value = appState.viewerUrl;
      document.getElementById('viewerExpiryDate').value = appState.viewerExpiresAt ? String(appState.viewerExpiresAt).slice(0, 10) : '';
      setQrImage(document.getElementById('viewerQrImage'), appState.viewerUrl, 280);
      document.getElementById('viewerShareDialog').showModal();
    }

    function createQrDataUrl(text, targetSize) {
      if (typeof qrcode !== 'function') throw new Error('端末内QR生成を初期化できませんでした。');
      var qr = qrcode(0, 'M');
      qr.addData(String(text || ''), 'Byte');
      qr.make();
      var moduleCount = qr.getModuleCount();
      var margin = 4;
      var cellSize = Math.max(2, Math.floor((Number(targetSize) - margin * 2) / moduleCount));
      return qr.createDataURL(cellSize, margin);
    }

    function setQrImage(image, text, targetSize) {
      try { image.src = createQrDataUrl(text, targetSize); }
      catch (error) { image.removeAttribute('src'); image.alt = 'QRコードを生成できませんでした'; }
    }

    async function copyViewerUrl() {
      if (!appState || !appState.viewerUrl) return;
      try {
        await navigator.clipboard.writeText(appState.viewerUrl);
        setStatus('表示専用URLをコピーしました。', 'success');
      } catch (error) {
        var input = document.getElementById('viewerUrlInput'); input.focus(); input.select();
        setStatus('URLを選択しました。コピー操作を行ってください。', 'warning');
      }
    }

    async function rotateViewerUrl() {
      if (!appState || !isEditing()) return;
      if (!confirm('現在共有している表示専用URLとQRコードをすべて無効化して、新しいURLを発行しますか？この操作は元に戻せません。')) return;
      var expiryPreview = document.getElementById('viewerExpiryDate').value;
      if (!confirm('最終確認：旧URLを直ちに無効化します。\n新しいURLの有効期限：' + (expiryPreview || '無期限') + '\n\n実行しますか？')) return;
      setLoading(true);
      try {
        var requestedExpiry = document.getElementById('viewerExpiryDate').value;
        var response = await callServer('rotateViewerAccess', editorKey, requestedExpiry ? requestedExpiry + 'T23:59:59+09:00' : '');
        if (!response || !response.success || !response.viewerUrl) throw new Error(response && response.message || '表示専用URLを再発行できませんでした。');
        appState.viewerUrl = response.viewerUrl;
        appState.viewerExpiresAt = response.viewerExpiresAt || '';
        document.getElementById('viewerUrlInput').value = response.viewerUrl;
        setQrImage(document.getElementById('viewerQrImage'), response.viewerUrl, 280);
        setStatus('旧URLを無効化し、新しい表示専用URLを発行しました。共有先へ新しいURLまたはQRコードを案内してください。', 'success');
      } catch (error) { setStatus(error.message, 'error'); }
      finally { setLoading(false); }
    }

    async function saveViewerQrImage() {
      if (!appState || !appState.viewerUrl) return;
      var safeLabel = String(appState.accountLabel || '大会').replace(/[\\/:*?"<>|]/g, '_').slice(0, 60) || '大会';
      try {
        var source = createQrDataUrl(appState.viewerUrl, 600);
        var qrImage = new Image();
        await new Promise(function(resolve, reject) { qrImage.onload = resolve; qrImage.onerror = reject; qrImage.src = source; });
        var canvas = document.createElement('canvas'); canvas.width = qrImage.naturalWidth; canvas.height = qrImage.naturalHeight;
        var context = canvas.getContext('2d'); context.imageSmoothingEnabled = false; context.drawImage(qrImage, 0, 0);
        var link = document.createElement('a'); link.href = canvas.toDataURL('image/png'); link.download = safeLabel + '-表示専用QR.png';
        document.body.appendChild(link); link.click(); link.remove();
        setStatus('QRコードを画像として保存しました。', 'success');
      } catch (error) {
        setStatus(error.message || 'QR画像を保存できませんでした。', 'error');
      }
    }

    function formatCurrentTime(date) {
      try {
        return new Intl.DateTimeFormat('ja-JP', {
          timeZone: 'Asia/Tokyo',
          hour: '2-digit',
          minute: '2-digit',
          hourCycle: 'h23'
        }).format(date);
      } catch (error) {
        return String(date.getHours()).padStart(2, '0') + ':' + String(date.getMinutes()).padStart(2, '0');
      }
    }

    function updateLiveClocks() {
      var now = new Date();
      var label = formatCurrentTime(now);
      document.querySelectorAll('[data-live-clock]').forEach(function(clock) {
        clock.textContent = label;
        clock.dateTime = now.toISOString();
      });
    }

    function startLiveClock() {
      updateLiveClocks();
      if (liveClockTimer) window.clearInterval(liveClockTimer);
      liveClockTimer = window.setInterval(updateLiveClocks, 1000);
    }

    function createLiveClock() {
      var clock = document.createElement('time');
      clock.className = 'live-clock';
      clock.setAttribute('data-live-clock', '');
      clock.setAttribute('aria-label', '現在時刻');
      return clock;
    }

    function createLiveClockRow() {
      var row = document.createElement('div');
      row.className = 'display-clock-row';
      row.appendChild(createLiveClock());
      return row;
    }

    function render() {
      document.body.classList.toggle('is-editing', isEditing());
      document.getElementById('updatedAt').textContent = appState.updatedAt ? '更新 ' + appState.updatedAt : '';
      document.querySelector('.eyebrow').textContent = (appState.accountLabel || 'WRO') + ' / TOURNAMENT OPERATIONS';
      document.getElementById('editButton').textContent = isEditing() ? '編集を終了' : '管理編集';
      document.getElementById('saveButton').disabled = !isEditing() || !isDirty;
      document.getElementById('undoButton').disabled = !isEditing() || undoHistory.length < 2;
      document.getElementById('discardButton').disabled = false;
      var notice = document.getElementById('securityNotice');
      notice.hidden = !appState.securityNotice || !isEditing();
      notice.textContent = appState.securityNotice || '';
      renderView(activeView);
      showView(activeView, false);
      refreshDisplayFullscreenBody();
      updateLiveClocks();
    }

    function renderView(view) {
      if (!appState) return;
      if (view === 'groups') renderGroups();
      else if (view === 'schedule') renderSchedule();
      else if (view === 'tournament') renderTournament();
      else if (view === 'links') renderLinks();
    }

    function renderGroups() {
      var container = document.getElementById('groupsView');
      container.textContent = '';
      var participantCount = getParticipatingTeams().length;
      var groupsTab = document.querySelector('[data-view="groups"]');
      if (groupsTab) groupsTab.textContent = 'グループ分け';
      container.appendChild(createSectionHeading('グループ分け', participantCount + 'チーム・' + appState.groupCount + 'グループの編成です。', viewerMode ? [] : [
        createHoldButton('1秒長押しでランダム組み分け', 'success', randomizeGroups, !isEditing()),
        createButton('予選リーグ_結果へ反映', 'danger', openGroupSyncPreview, !isEditing() || !participantCount)
      ]));

      var settings = document.createElement('div');
      settings.className = 'configuration-bar';
      settings.appendChild(createNumberSetting('グループ総数', appState.groupCount, 1, 16, function(value) {
        var fallbackSize = Number(appState.teamsPerGroup) || 1;
        appState.groupSizes = (appState.groupSizes || []).slice(0, value);
        while (appState.groupSizes.length < value) appState.groupSizes.push(fallbackSize);
        appState.groupCount = value;
        rebuildGroupSlots();
      }, true));
      (appState.groupSizes || []).forEach(function(size, index) {
        settings.appendChild(createNumberSetting(groupLabel(index) + 'グループのチーム数', size, 1, 32, function(value) {
          appState.groupSizes[index] = value;
          appState.teamsPerGroup = Math.max.apply(Math, appState.groupSizes);
          rebuildGroupSlots();
        }, true));
      });
      settings.appendChild(createNumberSetting('各グループ上位の自動進出数', appState.qualifiersPerGroup || 1, 1, 32, function(value) {
        appState.qualifiersPerGroup = value;
        markDirty();
      }));
      settings.appendChild(createNumberSetting('トーナメント総進出数', appState.tournamentParticipantCount, 2, 64, function(value) {
        normalizeTournamentParticipantDraft(value);
        rebuildTournamentScheduleFromParticipants();
        markTournamentDraftChanged();
      }, true));
      if (!viewerMode) container.appendChild(settings);
      var help = document.createElement('p');
      help.className = 'group-help';
      help.textContent = '設定は大会編成シートと双方向で保存されます。「予選リーグ_結果」への反映は自動では行いません。専用ボタンを1秒長押しした場合だけ、グループ分け欄が空欄であることを再確認して反映します。既存値は上書きしません。';
      if (!viewerMode) container.appendChild(help);
      if (isEditing()) container.appendChild(createRankingPolicyEditor('preliminary', '予選の順位決めポリシー'));
      if (isEditing()) container.appendChild(createTeamListEditor());

      var grid = document.createElement('div');

    function rebuildGroupSlots() {
      var count = Number(appState.groupCount) || 1;
      var sizes = (appState.groupSizes || []).slice(0, count);
      while (sizes.length < count) sizes.push(Number(appState.teamsPerGroup) || 1);
      var capacity = sizes.reduce(function(total, size) { return total + Number(size || 0); }, 0);
      var current = getParticipatingTeams();
      (appState.teams || []).forEach(function(team) {
        if (current.length < capacity && current.indexOf(team) < 0) current.push(team);
      });
      var next = [];
      for (var groupIndex = 0; groupIndex < count; groupIndex += 1) {
        var label = groupLabel(groupIndex);
        for (var slot = 1; slot <= sizes[groupIndex]; slot += 1) next.push({ id: label + slot, group: label, team: current.shift() || '' });
      }
      appState.groupSizes = sizes;
      appState.teamsPerGroup = Math.max.apply(Math, sizes);
      appState.groups = next;
      var previousStandings = appState.standings || [];
      appState.standings = next.map(function(group) {
        var previous = previousStandings.find(function(row) { return group.team && row.team === group.team; }) || {};
        return { id: group.id, group: group.group, team: group.team, points: previous.points || 0, score: previous.score || 0, purple: previous.purple || 0, violations: previous.violations || 0, rank: previous.rank || 0, seed: Boolean(previous.seed) };
      });
      syncGroupSchedule();
      markGroupDraftChanged();
    }

    function groupLabel(index) {
      var label = '';

    function applyCourtCountDraft() {
      if (!appState) return;
      var count = Math.min(26, Math.max(1, Number(appState.courtCount) || 1));
      var nextCourt = 0;
      var groupCourts = {}; var nextGroupCourt = 0;
      (appState.schedule || []).forEach(function(match) {
        var groupMatch = String(match.phase || '').match(/^(.+?)グループ予選/);
        var existingCourt = normalizeCourtLabel(match.court, count);
        if (groupMatch && existingCourt && !groupCourts[groupMatch[1]]) groupCourts[groupMatch[1]] = existingCourt;
      });
      (appState.schedule || []).forEach(function(match) {
        if (isOperationScheduleRow(match)) {
          match.court = '';
          return;
        }
        var originalCourt = String(match.court || '').trim();
        var rawCourt = normalizeCourtLabel(originalCourt, count);
        var court = rawCourt || courtLabel(nextCourt % count + 1);
        var groupMatch = String(match.phase || '').match(/^(.+?)グループ予選/);
        if (groupMatch && !rawCourt) {
          if (!groupCourts[groupMatch[1]]) groupCourts[groupMatch[1]] = courtLabel(nextGroupCourt++ % count + 1);
          court = groupCourts[groupMatch[1]];
        }
        match.court = String(court);
        nextCourt += 1;
      });
    }

    function createEditableTextCell(match, field, className, afterChange) {
      var cell = document.createElement('td'); cell.className = className || '';
      var input = document.createElement('input'); input.type = 'text'; input.value = match[field] || ''; input.disabled = !isEditing();
      input.addEventListener('change', function() {
        var oldValue = match[field] || ''; var nextValue = input.value.trim();
        if (!nextValue && field === 'id') { input.value = oldValue; return; }
        if (field === 'id' && appState.schedule.some(function(item) { return item !== match && item.id === nextValue; })) {
          input.value = oldValue;
          setStatus('試合ID「' + nextValue + '」は既に使われています。別のIDを入力してください。', 'error');
          return;
        }
        match[field] = nextValue; if (afterChange) afterChange(oldValue, nextValue); markScheduleDraftChanged(); renderSchedule();
      });
      cell.appendChild(input); return cell;
    }

    function courtLabel(index) {

    function normalizeCourtLabel(value, courtCount) {
      var raw = String(value || '').trim();
      if (!raw) return '';
      if (/^\d+$/.test(raw)) {
        var number = Number(raw);
        return number >= 1 && number <= Math.min(26, Number(courtCount) || 26) ? courtLabel(number) : '';
      }
      return raw;
    }

    function calculateOperationEndTime(startTime, note) {
      var startMatch = String(startTime || '').match(/^(\d{1,2}):(\d{2})$/);
      var durationMatch = String(note || '').match(/(\d+)\s*分/);
      if (!startMatch || !durationMatch) return '';
      var minutes = Number(startMatch[1]) * 60 + Number(startMatch[2]) + Number(durationMatch[1]);
      minutes %= 24 * 60;
      return String(Math.floor(minutes / 60)).padStart(2, '0') + ':' + String(minutes % 60).padStart(2, '0');
    }

    function clampNumber(value, minimum, maximum, fallback) {
      var number = Number(value);
      if (!Number.isFinite(number)) return fallback;
      return Math.min(maximum, Math.max(minimum, number));
    }

    function normalizeRankingPolicyDraft(policy, fallback) {
      var allowed = ['points', 'score', 'purple', 'violations']; var used = {}; var result = [];
      (Array.isArray(policy) ? policy : []).forEach(function(item) {
        if (!item || allowed.indexOf(item.key) < 0 || used[item.key]) return;
        used[item.key] = true; result.push({ key: item.key, direction: item.direction === 'asc' ? 'asc' : 'desc' });
      });
      fallback.forEach(function(item) { if (!used[item.key]) result.push({ key: item.key, direction: item.direction }); });
      return result.slice(0, 4);
    }

    function normalizeRankingPoliciesDraft(policies) {
      policies = policies && typeof policies === 'object' ? policies : {};
      return {
        preliminary: normalizeRankingPolicyDraft(policies.preliminary, RANKING_POLICY_DEFAULTS.preliminary),
        tournament: normalizeRankingPolicyDraft(policies.tournament, RANKING_POLICY_DEFAULTS.tournament)
      };
    }

    function compareByRankingPolicy(left, right, policy) {
      for (var index = 0; index < policy.length; index += 1) {
        var criterion = policy[index];
        var difference = Number(left[criterion.key] || 0) - Number(right[criterion.key] || 0);
        if (difference) return criterion.direction === 'asc' ? difference : -difference;
      }
      return 0;
    }

    function applyPreliminaryRankingPolicyDraft() {
      var policy = appState.rankingPolicies.preliminary;
      unique((appState.standings || []).map(function(row) { return row.group; }).filter(Boolean)).forEach(function(group) {
        var rows = appState.standings.filter(function(row) { return row.group === group && row.team; }).sort(function(left, right) {
          return compareByRankingPolicy(left, right, policy) || String(left.id).localeCompare(String(right.id), 'ja');
        });
        rows.forEach(function(row, index) { row.rank = index + 1; row.seed = index === 0; });
      });
    }

    function applyTournamentRankingPolicyDraft() {
      var policy = appState.rankingPolicies.tournament;
      (appState.schedule || []).filter(isTournamentScheduleMatch).forEach(function(match) {
        if (match.winnerOverride || !match.resultMetrics) return;
        var left = match.resultMetrics[match.team1]; var right = match.resultMetrics[match.team2];
        if (!left || !right) return;
        var comparison = compareByRankingPolicy(left, right, policy);
        match.winner = comparison < 0 ? match.team1 : comparison > 0 ? match.team2 : '';
      });
    }

    function loadBracketDisplaySettings(source) {

        fontSize: clampNumber(saved.fontSize, 14, 30, BRACKET_DISPLAY_DEFAULTS.fontSize),

        boxHeight: clampNumber(saved.boxHeight, 110, 400, BRACKET_DISPLAY_DEFAULTS.boxHeight),
        boxBorderWidth: clampNumber(saved.boxBorderWidth, 1, 7, BRACKET_DISPLAY_DEFAULTS.boxBorderWidth),

        matchInfoPosition: ['left', 'center', 'right'].indexOf(saved.matchInfoPosition) >= 0 ? saved.matchInfoPosition : BRACKET_DISPLAY_DEFAULTS.matchInfoPosition,
        bottomUpStyle: saved.bottomUpStyle === 'detailed' ? 'detailed' : 'classic',
        classicSeedWidth: clampNumber(saved.classicSeedWidth, 80, 240, BRACKET_DISPLAY_DEFAULTS.classicSeedWidth),
        classicSeedHeight: clampNumber(saved.classicSeedHeight, 150, 520, BRACKET_DISPLAY_DEFAULTS.classicSeedHeight),

        classicBackground: /^#[0-9a-f]{6}$/i.test(String(saved.classicBackground || '')) ? String(saved.classicBackground) : BRACKET_DISPLAY_DEFAULTS.classicBackground,
        connectionOffsets: normalizeConnectionOffsets(saved.connectionOffsets)

    function normalizeConnectionOffsets(value) {
      var result = {};
      Object.keys(value && typeof value === 'object' ? value : {}).slice(0, 256).forEach(function(key) {
        result[String(key).slice(0, 120)] = clampNumber(value[key], -400, 400, 0);
      });
      return result;

    function normalizeTournamentParticipantDraft(count) {
      if (!appState) return [];
      count = Math.min(64, Math.max(2, Number(count) || 2));
      var participants = Array.isArray(appState.tournamentParticipants) ? appState.tournamentParticipants.slice(0, count) : [];
      if (!participants.some(Boolean)) {
        participants = [];
        (appState.schedule || []).filter(isTournamentScheduleMatch).forEach(function(match) {
          [match.team1, match.team2].forEach(function(team) {
            if (isActualTeamName(team) && participants.indexOf(team) < 0) participants.push(team);
          });
        });
        participants = participants.slice(0, count);
      }
      while (participants.length < count) participants.push('');
      appState.tournamentParticipantCount = count;
      appState.tournamentParticipants = participants;
      return participants;
    }

    function isTournamentScheduleMatch(match) {
      return Boolean(match) && (/トーナメント|決勝/.test(match.phase || '') || /^(R\d+-|F-|SF-|3P-)/.test(match.id || ''));
    }

    function createTournamentScheduleDraft(participants, thirdPlaceEnabled) {
      var count = Math.max(2, participants.length);
      var size = 1;
      while (size < count) size *= 2;
      var sources = participants.slice(0, count).map(function(team) { return team || '未定'; });
      while (sources.length < size) sources.push('BYE');
      var matches = [];
      var round = 1;
      while (sources.length > 1) {
        var next = [];
        for (var index = 0; index < sources.length; index += 2) {
          var id = sources.length === 2 ? 'F-1' : 'R' + round + '-' + (index / 2 + 1);
          var team1 = sources[index] || 'BYE';
          var team2 = sources[index + 1] || 'BYE';
          matches.push({ id: id, phase: sources.length === 2 ? '決勝' : 'トーナメント' + round + '回戦', startTime: '', court: '', team1: team1, team2: team2, winnerOverride: team1 === 'BYE' ? team2 : team2 === 'BYE' ? team1 : '', winner: '', note: '' });
          next.push(id + ' 勝者');
        }
        sources = next;
        round += 1;
      }
      if (thirdPlaceEnabled && round > 2) {
        var semifinals = matches.filter(function(row) { return row.phase === 'トーナメント' + (round - 2) + '回戦'; });
        if (semifinals.length >= 2) matches.splice(matches.length - 1, 0, { id: '3P-1', phase: '3位決定戦', startTime: '', court: '', team1: semifinals[0].id + ' 敗者', team2: semifinals[1].id + ' 敗者', winnerOverride: '', winner: '', note: '' });
      }
      return matches;
    }

    function rebuildTournamentScheduleFromParticipants() {
      var previous = {};
      (appState.schedule || []).filter(isTournamentScheduleMatch).forEach(function(match) { previous[match.id] = match; });
      var nonTournament = (appState.schedule || []).filter(function(match) { return !isTournamentScheduleMatch(match); });
      var generated = createTournamentScheduleDraft(appState.tournamentParticipants || [], Boolean(appState.thirdPlaceEnabled));
      generated.forEach(function(match) {
        var old = previous[match.id];
        if (!old) return;
        match.startTime = old.startTime || '';
        match.court = old.court || '';
        match.note = old.note || '';
        if (old.team1 === match.team1 && old.team2 === match.team2) {
          match.winnerOverride = old.winnerOverride || '';
          match.winner = old.winner || '';
        }
      });
      appState.schedule = nonTournament.concat(generated);
      (appState.seedSlots || []).forEach(function(slot) {
        var target = findScheduleMatch(slot.targetMatchId);
        if (target && slot.participant) target[slot.targetSide] = slot.participant;
      });
      applyCourtCountDraft();
    }

    function applySeedSlotChanges(previousSlots) {
      var usedParticipants = {}; var usedTargets = {}; var duplicateMessage = '';
      (appState.seedSlots || []).forEach(function(slot) {
        if (slot.participant && usedParticipants[slot.participant]) duplicateMessage = '同じ出場元を複数のシード枠へ設定できません。';
        if (slot.participant) usedParticipants[slot.participant] = true;
        var targetKey = slot.targetMatchId && slot.participant ? slot.targetMatchId + ':' + slot.targetSide : '';
        if (targetKey && usedTargets[targetKey]) duplicateMessage = '同じ試合の同じ合流位置へ複数のシード枠を設定できません。';
        if (targetKey) usedTargets[targetKey] = true;
      });
      if (duplicateMessage) {
        appState.seedSlots = normalizeSeedSlotsDraft(previousSlots);
        renderTournament(); setStatus(duplicateMessage, 'error'); return false;
      }
      var previousTargets = {};
      (previousSlots || []).forEach(function(slot) { if (slot.targetMatchId && slot.participant) previousTargets[slot.targetMatchId + ':' + slot.targetSide] = slot.participant; });
      var conflicts = (appState.seedSlots || []).filter(function(slot) {
        var match = findScheduleMatch(slot.targetMatchId); var key = slot.targetMatchId + ':' + slot.targetSide;
        return match && slot.participant && match[slot.targetSide] && match[slot.targetSide] !== slot.participant && match[slot.targetSide] !== previousTargets[key];
      });
      if (conflicts.length && !confirm('指定した合流先には既に対戦相手が設定されています。シード枠で上書きしますか？')) {
        appState.seedSlots = normalizeSeedSlotsDraft(previousSlots);

        var match = findScheduleMatch(slot.targetMatchId);
        if (match && slot.targetSide && match[slot.targetSide] === slot.participant) match[slot.targetSide] = '';
      });
      (appState.seedSlots || []).forEach(function(slot) {

        if (match && slot.participant) {
          match[slot.targetSide] = slot.participant;
          match.winnerOverride = ''; match.winner = '';

      return true;
    }

    function createGenericBracket() {
      var canvas = document.createElement('div');
      canvas.className = 'generic-bracket';
      if (isEditing() && bracketConnectionMode) canvas.classList.add('is-connection-editing');
      applyBracketDisplaySettingsToCanvas(canvas);
      if (canvas.dataset.layoutDirection === 'bottom-up') {
        canvas.classList.add(bracketDisplaySettings.bottomUpStyle === 'detailed' ? 'is-detailed-bottom-up' : 'is-classic-bottom-up');
      }
      canvas.style.height = 'auto';
      canvas.style.setProperty('--tree-line', bracketDisplaySettings.lineWidth + 'px');
      var tournamentMatches = (appState.schedule || []).filter(function(match) {
        return /トーナメント|決勝/.test(match.phase || '') || /^(R\d+-|F-|SF-|3P-)/.test(match.id || '');
      }).filter(function(match) { return match.id !== '3P-1'; });
      var byId = {};
      tournamentMatches.forEach(function(match) { byId[match.id] = match; });
      function sourceId(value) { var match = String(value || '').match(/^(.*?) (勝者|敗者)$/); return match && byId[match[1]] ? match[1] : ''; }
      function depth(match, trail) {
        trail = trail || {};
        if (!match || trail[match.id]) return 1;
        var nextTrail = Object.assign({}, trail); nextTrail[match.id] = true;
        return 1 + Math.max(sourceId(match.team1) ? depth(byId[sourceId(match.team1)], nextTrail) : 0, sourceId(match.team2) ? depth(byId[sourceId(match.team2)], nextTrail) : 0);
      }
      var actualSeeds = normalizeTournamentParticipantDraft(Number(appState.tournamentParticipantCount || 2)).map(function(team) { return team || '未定'; });
      var maxDepth = tournamentMatches.reduce(function(maximum, match) { return Math.max(maximum, depth(match)); }, 1);
      var finalMatch = tournamentMatches.filter(function(match) { return depth(match) === maxDepth; }).sort(function(left, right) {
        return String(left.id).localeCompare(String(right.id), 'ja', { numeric: true });
      })[0] || null;
      var championTeam = finalMatch ? String(finalMatch.winnerOverride || finalMatch.winner || '').trim() : '';

      var seedRound = document.createElement('section'); seedRound.className = 'generic-round seed-round';
      var seedTitle = document.createElement('h3'); seedTitle.textContent = '参加枠（' + actualSeeds.length + '）'; seedRound.appendChild(seedTitle);
      actualSeeds.forEach(function(team, index) {
        var card = document.createElement('div'); card.className = 'generic-card seed-card'; card.dataset.nodeId = 'seed-' + index; card.dataset.team = team;
        if (championTeam && isSameTeam(championTeam, team)) card.classList.add('is-champion-seed');
        var strong = document.createElement('strong'); strong.textContent = '枠 ' + (index + 1); card.appendChild(strong);
        var slot = document.createElement('span'); slot.className = 'generic-slot'; slot.textContent = team; card.appendChild(slot); seedRound.appendChild(card);
        appendConnectionSourcePort(card, team, '枠から接続', 'is-winner-port');
      });
      canvas.appendChild(seedRound);

      var firstRoundSeedBase = {};
      tournamentMatches.filter(function(match) { return depth(match) === 1; }).sort(function(left, right) {
        return String(left.id).localeCompare(String(right.id), 'ja', { numeric: true });
      }).forEach(function(match, index) { firstRoundSeedBase[match.id] = index * 2; });
      var positionCache = {};
      function sourcePosition(value, trail, ownerMatch, field) {
        var referencedId = sourceId(value);
        if (referencedId) return matchPosition(byId[referencedId], trail);
        var seedIndex = value === '未定' ? -1 : actualSeeds.indexOf(value);
        if (seedIndex < 0 && ownerMatch && firstRoundSeedBase[ownerMatch.id] !== undefined) {
          seedIndex = firstRoundSeedBase[ownerMatch.id] + (field === 'team2' ? 1 : 0);
        }
        return seedIndex >= 0 ? seedIndex : actualSeeds.length / 2;
      }
      function matchPosition(match, trail) {
        if (!match) return actualSeeds.length / 2;
        if (positionCache[match.id] !== undefined) return positionCache[match.id];
        trail = trail || {};
        if (trail[match.id]) return actualSeeds.length / 2;
        var nextTrail = Object.assign({}, trail); nextTrail[match.id] = true;
        var result = (sourcePosition(match.team1, nextTrail, match, 'team1') + sourcePosition(match.team2, nextTrail, match, 'team2')) / 2;
        positionCache[match.id] = result;
        return result;
      }
      for (var roundDepth = 1; roundDepth <= maxDepth; roundDepth += 1) {
        var roundMatches = tournamentMatches.filter(function(match) { return depth(match) === roundDepth; });
        roundMatches.sort(function(left, right) {
          return matchPosition(left) - matchPosition(right) || String(left.id).localeCompare(String(right.id), 'ja', { numeric: true });
        });
        if (!roundMatches.length) continue;
        var round = document.createElement('section'); round.className = 'generic-round';
        var title = document.createElement('h3'); title.textContent = roundDepth === maxDepth ? '決勝' : 'ラウンド ' + roundDepth; round.appendChild(title);
        roundMatches.forEach(function(match) {
          var card = document.createElement('div'); card.className = 'generic-card match-card'; card.dataset.nodeId = match.id;
          var strong = document.createElement('strong'); strong.className = 'generic-match-meta';
          var matchId = document.createElement('span'); matchId.className = 'generic-match-id'; matchId.textContent = match.id; strong.appendChild(matchId);
          if (match.court) { var matchCourt = document.createElement('span'); matchCourt.className = 'generic-match-court'; matchCourt.textContent = 'コート' + match.court; strong.appendChild(matchCourt); }
          else { var pendingCourt = document.createElement('span'); pendingCourt.className = 'generic-match-court'; pendingCourt.textContent = 'コート未定'; strong.appendChild(pendingCourt); }
          var matchup = document.createElement('span'); matchup.className = 'generic-matchup';
          var matchupTeam1 = document.createElement('span'); matchupTeam1.textContent = displayBracketSlot(match.team1); matchup.appendChild(matchupTeam1);
          var versus = document.createElement('b'); versus.textContent = '対'; matchup.appendChild(versus);
          var matchupTeam2 = document.createElement('span'); matchupTeam2.textContent = displayBracketSlot(match.team2); matchup.appendChild(matchupTeam2);
          strong.appendChild(matchup);
          var matchTime = document.createElement('span'); matchTime.className = 'generic-match-time'; matchTime.textContent = match.startTime || '時刻未定'; strong.appendChild(matchTime);
          card.appendChild(strong);
          ['team1', 'team2'].forEach(function(field) {
            var slot = document.createElement('span'); slot.className = 'generic-slot'; slot.dataset.source = sourceId(match[field]); slot.dataset.team = match[field]; slot.dataset.field = field; slot.textContent = displayBracketSlot(match[field]); card.appendChild(slot);
            slot.dataset.targetKey = match.id + ':' + field;
            if (!slot.dataset.source) {
              var directSeedIndex = match[field] === '未定' ? -1 : actualSeeds.indexOf(match[field]);
              if (directSeedIndex < 0 && firstRoundSeedBase[match.id] !== undefined) directSeedIndex = firstRoundSeedBase[match.id] + (field === 'team2' ? 1 : 0);
              if (directSeedIndex >= 0 && directSeedIndex < actualSeeds.length) slot.dataset.seedIndex = String(directSeedIndex);
            }
            appendConnectionTargetControls(slot, match, field);
          });
          appendConnectionSourcePort(card, match.id + ' 勝者', match.id + 'の勝者', 'is-winner-port');
          appendConnectionSourcePort(card, match.id + ' 敗者', match.id + 'の敗者', 'is-loser-port');
          round.appendChild(card);
        });
        canvas.appendChild(round);
      }
      if (canvas.dataset.layoutDirection === 'bottom-up' && finalMatch) {
        var championRound = document.createElement('section'); championRound.className = 'generic-round champion-round';
        var championCard = document.createElement('div'); championCard.className = 'generic-card champion-card'; championCard.dataset.nodeId = 'champion';
        var championTitle = document.createElement('strong'); championTitle.textContent = '優勝'; championCard.appendChild(championTitle);
        var championSlot = document.createElement('span'); championSlot.className = 'generic-slot'; championSlot.dataset.source = finalMatch.id; championSlot.dataset.team = finalMatch.id + ' 勝者'; championSlot.dataset.field = 'champion'; championSlot.dataset.targetKey = 'champion'; championSlot.textContent = championTeam || '未定'; championCard.appendChild(championSlot);
        championRound.appendChild(championCard); canvas.appendChild(championRound);
      }
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('class', 'generic-bracket-lines'); canvas.insertBefore(svg, canvas.firstChild);
      observeGenericBracket(canvas);
      scheduleGenericBracketLineDraw(canvas);
      return canvas;
    }

    function appendConnectionSourcePort(card, value, label, className) {
      if (!isEditing()) return;
      var port = document.createElement('button'); port.type = 'button'; port.className = 'connection-port connection-source ' + className;
      port.textContent = className === 'is-loser-port' ? '敗' : / 勝者$/.test(value) ? '勝' : '枠'; port.title = label; port.draggable = true;
      port.addEventListener('dragstart', function(event) { event.dataTransfer.setData('text/plain', value); event.dataTransfer.effectAllowed = 'link'; });
      port.addEventListener('click', function(event) {
        event.stopPropagation(); pendingBracketConnection = value;
        document.querySelectorAll('.connection-source').forEach(function(item) { item.classList.remove('is-selected'); });
        port.classList.add('is-selected'); setStatus('接続先の緑色の点をクリックしてください。', 'warning');
      });
      card.appendChild(port);
    }

    function appendConnectionTargetControls(slot, match, field) {

        return ['team1', 'team2'].some(function(field) {

        var source = null;

        if (!source && slot.dataset.seedIndex !== undefined) source = canvas.querySelector('[data-node-id="seed-' + CSS.escape(slot.dataset.seedIndex) + '"]');

          from: from,
          to: to,
          targetCard: targetCard,
          targetField: slot.dataset.field || 'team1',

      });
      var byTarget = {};
      connections.forEach(function(connection) { (byTarget[connection.targetKey] || (byTarget[connection.targetKey] = [])).push(connection); });

            var verticalY1 = from.top - bounds.top;
            var targetRatio = connection.targetField === 'champion' ? 0.5 : (connection.targetField === 'team2' ? 0.65 : 0.35);
            var verticalX2 = connection.targetCard.left + connection.targetCard.width * targetRatio - bounds.left;

          var x2 = to.left - bounds.left; var y2 = to.top + to.height / 2 - bounds.top;

        if (isEditing() && bracketConnectionMode) {

    function appendLineAdjustmentHandle(svg, x, y) {

    function bindLineAdjustmentDrag(dragTarget, path, canvas, connectionKey, currentOffset, preview) {

    function findSeedTeam(group, fallback) {
      var standing = appState.standings.find(function(row) {
        return row.seed && row.group === group;
      });
      return standing && standing.team ? standing.team : fallback;
    }

    function getResolvedWinner(match, trail) {
      if (!match) return '';
      if (!match.winner || match.winner === '未定') {
        var first = resolveBracketSlot(match.team1, trail || {});
        var second = resolveBracketSlot(match.team2, trail || {});
        if (isActualTeamName(first) && isVacantBracketSlot(match.team2)) return first;
        if (isActualTeamName(second) && isVacantBracketSlot(match.team1)) return second;
        return '';
      }
      return resolveBracketSlot(match.winner, trail || {});
    }

    function isVacantBracketSlot(value) {
      var text = String(value || '').trim();
      return !text || text === '不戦通過';
    }

    function getResolvedLoser(match, trail) {
      if (!match) return '';
      var winner = getResolvedWinner(match, trail || {});
      var first = displayBracketSlot(match.team1, trail || {});
      var second = displayBracketSlot(match.team2, trail || {});
      if (!winner || winner === '引き分け') return '';
      if (isSameTeam(winner, first)) return second;
      if (isSameTeam(winner, second)) return first;
      return '';
    }

    function resolveBracketSlot(value, trail) {
      var text = String(value || '').trim();
      var groupRank = text.match(/^([A-Z]+)グループ(\d+)位$/);
      if (groupRank) {
        var standing = (appState.standings || []).find(function(row) {
          return row.group === groupRank[1] && Number(row.rank) === Number(groupRank[2]) && row.team;
        });
        return standing ? standing.team : text;
      }
      var match = text.match(/^(.+?) (勝者|敗者)$/);
      if (!match) return text;
      var key = match[1] + '|' + match[2];
      if (trail[key]) return text;
      var source = findScheduleMatch(match[1]);
      if (!source) return text;
      trail[key] = true;
      var result = match[2] === '勝者'
        ? getResolvedWinner(source, trail)
        : getResolvedLoser(source, trail);
      delete trail[key];
      return result || text;
    }

    function displayBracketSlot(value, trail) {
      var text = resolveBracketSlot(value, trail || {});
      return text || '未定';
    }

    function isSameTeam(left, right) {
      return Boolean(left && right && String(left).trim() === String(right).trim());
    }

    function isActualTeamName(value) {
      var text = String(value || '').trim();
      return Boolean(text) && (appState.teams || []).some(function(team) {
        return String(team || '').trim() === text;
      });
    }

    function createBracketTime(match, centerX, top) {

      time.className = 'bracket-time';

      time.style.top = top + 'px';

    function setBracketTeamName(element, text) {
      var value = String(text || '未定').trim() || '未定';
      var compactValue = value.replace(/[\s\u3000]+/g, '');
      var length = Array.from(compactValue).length;
      var lines = getBracketTeamNameLines(value);
      element.textContent = '';
      lines.forEach(function(line, index) {
        var span = document.createElement('span');
        span.className = 'bracket-team-line';
        span.textContent = line;
        element.appendChild(span);
      });
      element.title = value;
      element.setAttribute('aria-label', value);
      element.classList.toggle('is-long', length > 10);
      element.classList.toggle('is-very-long', length > 16);
    }

    function getBracketTeamNameLines(value) {
      if (bracketDisplaySettings.orientation === 'vertical') {
        return [value.replace(/[\s\u3000]+/g, '') || '未定'];
      }
      if (bracketDisplaySettings.wrapMode === 'none') return [value];

      var maximum = bracketDisplaySettings.wrapMode === 'auto'
        ? 10
        : Number(bracketDisplaySettings.wrapMode) || 10;
      var words = value.split(/[\s\u3000]+/).filter(Boolean);
      if (!words.length) return ['未定'];

      var lines = [];
      words.forEach(function(word) {
        var characters = Array.from(word);
        if (characters.length <= maximum) {
          lines.push(word);
          return;
        }
        for (var index = 0; index < characters.length; index += maximum) {
          lines.push(characters.slice(index, index + maximum).join(''));
        }
      });
      return lines;
    }

    function getTournamentPhaseLabel(match) {
      if (!match) return '';
      if (match.id === 'F-1') return '決勝';
      if (match.id === '3P-1') return '3位決定戦';
      if (match.id.indexOf('SF-') === 0) return '準決勝 ' + match.id.slice(3);
      if (match.id.indexOf('T-') === 0) return '1回戦 ' + match.id.slice(2);
      return match.phase || match.id;
    }

    function createRoundRobinRounds(entries) {
      var players = entries.slice();
      if (players.length < 2) return [];
      if (players.length % 2) players.push(null);
      var rounds = [];
      for (var round = 0; round < players.length - 1; round += 1) {
        var pairs = [];
        for (var index = 0; index < players.length / 2; index += 1) {
          var left = players[index]; var right = players[players.length - 1 - index];
          if (left && right) pairs.push([left, right]);
        }
        rounds.push(pairs);
        players = [players[0], players[players.length - 1]].concat(players.slice(1, players.length - 1));
      }
      return rounds;
    }

    function buildInterleavedRoundRobin(groups) {
      var groupNames = unique((groups || []).map(function(row) { return row.group; }).filter(Boolean));
      var data = groupNames.map(function(group) {
        return { group: group, rounds: createRoundRobinRounds((groups || []).filter(function(row) { return row.group === group && row.team; })) };
      });
      var maximumRounds = data.reduce(function(maximum, item) { return Math.max(maximum, item.rounds.length); }, 0);
      var counters = {}; var result = [];
      for (var round = 0; round < maximumRounds; round += 1) {
        var orderedGroups = data;
        var maximumPairs = orderedGroups.reduce(function(maximum, item) { return Math.max(maximum, (item.rounds[round] || []).length); }, 0);
        for (var pairIndex = 0; pairIndex < maximumPairs; pairIndex += 1) {
          orderedGroups.forEach(function(item) {
            var pair = (item.rounds[round] || [])[pairIndex];
            if (!pair) return;
            counters[item.group] = (counters[item.group] || 0) + 1;
            result.push({ id: 'P-' + item.group + '-' + counters[item.group], phase: item.group + 'グループ予選', startTime: '', court: '', team1: pair[0].team, team2: pair[1].team, winner: '', winnerOverride: '', note: '' });
          });
        }
      }
      return result;
    }

    function syncGroupSchedule() {
      var tournament = (appState.schedule || []).filter(isTournamentScheduleMatch);
      var operations = (appState.schedule || []).filter(function(match) {
        return !isTournamentScheduleMatch(match) && !/^P-/.test(String(match.id || '')) && String(match.phase || '').indexOf('グループ予選') < 0;
      });
      var initialAdjustment = operations.filter(function(match) { return String(match.id || '') === 'ADJ-START'; });
      var otherOperations = operations.filter(function(match) { return String(match.id || '') !== 'ADJ-START'; });
      var preliminary = buildInterleavedRoundRobin(appState.groups || []);
      appState.schedule = initialAdjustment.concat(preliminary).concat(otherOperations).concat(tournament);
      applyCourtCountDraft();
    }

    function createGroupPairIds(assignments) {
      var activeIds = ['A1', 'A2', 'A3', 'B1', 'B2', 'B3'].filter(function(id) {
        return Boolean(assignments[id]);
      });
      if (activeIds.length === 4) {
        var roundRobinPairs = [];
        for (var leftIndex = 0; leftIndex < activeIds.length; leftIndex += 1) {
          for (var rightIndex = leftIndex + 1; rightIndex < activeIds.length; rightIndex += 1) {
            roundRobinPairs.push([activeIds[leftIndex], activeIds[rightIndex]]);
          }
        }
        return roundRobinPairs;
      }
      var pairs = [];
      ['A', 'B'].forEach(function(groupId) {
        var ids = ['1', '2', '3'].map(function(number) { return groupId + number; }).filter(function(id) {
          return Boolean(assignments[id]);
        });
        var groupPairs = ids.length === 3
          ? [[ids[0], ids[1]], [ids[1], ids[2]], [ids[2], ids[0]]]
          : ids.length === 2 ? [[ids[0], ids[1]]] : [];
        while (groupPairs.length < 3) groupPairs.push(['', '']);
        pairs = pairs.concat(groupPairs.slice(0, 3));
      });
      return pairs;
    }

    function randomizeGroups() {
      var participants = getParticipatingTeams();
      var capacity = (appState.groupSizes || []).reduce(function(total, size) { return total + Number(size || 0); }, 0);
      (appState.teams || []).forEach(function(team) {
        if (participants.length < capacity && participants.indexOf(team) < 0) participants.push(team);
      });
      if (!participants.length) {
        setStatus('参加チームを1チーム以上選択してください。', 'error');
        return;
      }
      for (var index = participants.length - 1; index > 0; index -= 1) {
        var target = Math.floor(Math.random() * (index + 1));
        var temporary = participants[index]; participants[index] = participants[target]; participants[target] = temporary;
      }
      var nextGroups = []; var participantIndex = 0;
      (appState.groupSizes || []).forEach(function(size, groupIndex) {
        var group = groupLabel(groupIndex);
        for (var slot = 1; slot <= Number(size); slot += 1) {
          nextGroups.push({ id: group + slot, group: group, team: participants[participantIndex++] || '' });
        }
      });
      appState.groups = nextGroups;
      appState.standings = nextGroups.map(function(group) {
        return { id: group.id, group: group.group, team: group.team, points: 0, score: 0, purple: 0, violations: 0, rank: 0, seed: false };
      });
      syncGroupSchedule();
      markDirty();
      render();
      setStatus('組み分けと予選順を端末へ一時保存しました。「変更を保存」で確定してください。', 'success');
    }

    function collectScheduleWarnings(schedule) {
      var warnings = [];
      function validTime(value) {
        if (!value) return true;
        var match = String(value).match(/^(\d{1,2}):(\d{2})$/);
        return Boolean(match && Number(match[1]) >= 0 && Number(match[1]) <= 23 && Number(match[2]) >= 0 && Number(match[2]) <= 59);
      }
      (schedule || []).forEach(function(row, index) {
        if (!validTime(row.startTime) || !validTime(row.endTime)) warnings.push((row.id || (index + 1) + '行目') + 'の時刻');
        if (row.court && !/^[A-Z]$/i.test(String(row.court).trim())) warnings.push((row.id || (index + 1) + '行目') + 'のコート「' + row.court + '」');
      });
      return warnings.slice(0, 8);
    }

      message.push('', 'この内容をアカウントへ保存しますか？');
      return message.join('\n');
    }

    async function submitEditorKey(event) {
      event.preventDefault();
      if (loginInFlight) return;
      var candidate = document.getElementById('editorKey').value;
      loginInFlight = true;
      setLoading(true);
      try {
        var response = null;
        for (var attempt = 0; attempt < 2; attempt += 1) {
          try {
            response = await callServer('authorizeEditor', candidate);
            break;
          } catch (authorizeError) { if (attempt === 1) throw authorizeError; }
          if (attempt === 0) await new Promise(function(resolve) { window.setTimeout(resolve, 250); });
        }
        if (!response || !response.success) throw new Error(response && response.message || '編集キーを確認できませんでした。');
        if (!response.sessionToken) throw new Error('編集セッションを開始できませんでした。');
        var sessionToken = response.sessionToken;
        var state = null;
        for (var stateAttempt = 0; stateAttempt < 2; stateAttempt += 1) {
          try { state = await callServer('getCompetitionState', sessionToken); }
          catch (stateError) { if (stateAttempt === 1) throw stateError; }
          if (state && state.success) break;
          if (stateAttempt === 0) await new Promise(function(resolve) { window.setTimeout(resolve, 250); });
        }
        if (!state || !state.success) throw new Error(state && state.message || '大会情報を読み込めませんでした。');
        editorKey = sessionToken;
        sessionReauthInProgress = false;
        sessionStorage.removeItem('tournamentAdminPassword');
        var dialog = document.getElementById('editDialog');
        dialog.dataset.forceLogin = 'false';
        var closeButton = dialog.querySelector('[data-close-dialog]');
        if (closeButton) closeButton.hidden = false;
        editModeActive = true;
        setCompetitionState(state);
        document.getElementById('quickGuide').open = false;
        lastStateSignature = createStateSignature(state);
        var restoredDraft = restoreDraftCache(state);
        isDirty = Boolean(restoredDraft);
        dialog.close();
        render();
        setStatus(restoredDraft
          ? (response.accountLabel || '') + 'へ接続し、この端末の未保存変更を復元しました。'
          : (response.accountLabel || '') + 'のGASへ接続しました。', restoredDraft ? 'warning' : 'success');
      } catch (error) {
        setStatus(error.message, 'error');
        if (!appState && !document.getElementById('editDialog').open) openEditDialog(true);
      }
      finally {
        candidate = '';
        document.getElementById('editorKey').value = '';
        loginInFlight = false;
        setLoading(false);
      }
    }

      if (undoHistory.length > 50) { undoHistory.shift(); undoBaselineAvailable = false; }
    }

    function undoLastChange() {
      if (!isEditing() || undoHistory.length < 2) return;
      undoHistory.pop();
      var restored = JSON.parse(undoHistory[undoHistory.length - 1]);
      appState = restored.appState;
      teamListDirty = Boolean(restored.teamListDirty);
      bracketDisplaySettings = loadBracketDisplaySettings(appState.bracketDisplaySettings);
      scheduleDisplaySettings = loadScheduleDisplaySettings(appState.scheduleDisplaySettings);
      saveBracketDisplaySettings();
      isDirty = undoHistory.length > 1 || !undoBaselineAvailable;
      if (isDirty) saveDraftCache(); else clearDraftCache();
      render();
      setStatus(isDirty ? '直前の変更を元に戻しました。現在の状態は端末へ一時保存されています。' : '変更前の保存済み状態へ戻しました。', isDirty ? 'warning' : 'success');
    }

    function getDraftCacheKey(state) {
      state = state || appState || {};
      var identity = String(state.accountLabel || '') + '|' + String(state.spreadsheetUrl || '');
      return identity === '|' ? '' : DRAFT_CACHE_PREFIX + encodeURIComponent(identity);
    }

    function saveDraftCache() {
      var key = getDraftCacheKey();
      if (!key || !appState) return;
      try {
        localStorage.setItem(key, JSON.stringify({ savedAt: Date.now(), baseRevision: appState.draftBaseRevision || appState.serverRevision || '', appState: appState, teamListDirty: Boolean(teamListDirty), bracketDisplaySettings: bracketDisplaySettings }));
      } catch (error) {
        setStatus('端末の一時保存容量が不足しています。「変更を保存」で確定してください。', 'error');
      }
    }

    function restoreDraftCache(serverState) {
      var key = getDraftCacheKey(serverState);
      if (!key) return false;
      try {
        var cached = JSON.parse(localStorage.getItem(key) || 'null');
        if (!cached || !cached.appState) return false;
        if (!cached.savedAt || Date.now() - Number(cached.savedAt) > DRAFT_CACHE_MAX_AGE_MS) {
          localStorage.removeItem(key);
          return false;
        }
        var trusted = {
          success: serverState.success,
          canEdit: serverState.canEdit,
          editorKeyRequired: serverState.editorKeyRequired,
          accountLabel: serverState.accountLabel,
          spreadsheetName: serverState.spreadsheetName,
          spreadsheetUrl: serverState.spreadsheetUrl,
          gasUrl: serverState.gasUrl,
          viewerUrl: serverState.viewerUrl,
          isMaster: Boolean(serverState.isMaster),
          securityNotice: serverState.securityNotice
        };
        appState = Object.assign({}, serverState, cached.appState, trusted);
        appState.draftBaseRevision = String(cached.baseRevision || cached.appState.serverRevision || '__legacy_draft__').trim();
        appState.serverRevision = serverState.serverRevision || '';
        teamListDirty = Boolean(cached.teamListDirty);
        if (cached.bracketDisplaySettings) bracketDisplaySettings = loadBracketDisplaySettings(cached.bracketDisplaySettings);
        if (cached.appState.scheduleDisplaySettings) scheduleDisplaySettings = loadScheduleDisplaySettings(cached.appState.scheduleDisplaySettings);
        recordUndoSnapshot();
        return true;
      } catch (error) {
        localStorage.removeItem(key);
        return false;
      }
    }

    function clearDraftCache() {
      var key = getDraftCacheKey();
      if (key) localStorage.removeItem(key);
    }

    function cleanupExpiredDraftCaches() {
      try {
        var now = Date.now();
        for (var index = localStorage.length - 1; index >= 0; index -= 1) {
          var key = localStorage.key(index);
          if (!key || key.indexOf(DRAFT_CACHE_PREFIX) !== 0) continue;
          var cached;
          try { cached = JSON.parse(localStorage.getItem(key) || 'null'); } catch (error) { cached = null; }
          if (!cached || !cached.savedAt || now - Number(cached.savedAt) > DRAFT_CACHE_MAX_AGE_MS) localStorage.removeItem(key);
        }
      } catch (error) {}
    }

    function resolveSaveConflict(response, payload) {
      var current = response && response.currentState;
      if (!current) return false;
      var differences = [];
      if (JSON.stringify(appState.groups || []) !== JSON.stringify(current.groups || [])) differences.push('グループ分け');
      if (JSON.stringify(appState.schedule || []) !== JSON.stringify(current.schedule || [])) differences.push('タイムスケジュール／試合結果');
      if (JSON.stringify(appState.teamList || []) !== JSON.stringify(current.teamList || [])) differences.push('チームリスト');
      if (JSON.stringify(appState.tournamentParticipants || []) !== JSON.stringify(current.tournamentParticipants || [])) differences.push('トーナメント参加枠');
      var summary = differences.length ? differences.join('、') : '更新日時または外部試合結果';
      var overwrite = confirm('保存後に別の端末またはメインアプリから変更が届いています。\n\n差分：' + summary + '\nサーバー最終更新：' + (current.updatedAt || '不明') + '\n\nOK：この端末の内容で上書き\nキャンセル：上書きせず停止');
      if (overwrite) {
        payload.forceSave = true;
        payload.baseRevision = current.serverRevision || '';
        return true;
      }
      if (confirm('サーバーの最新内容を読み込み、現在の端末変更を破棄しますか？\nキャンセルすると端末変更を保持したまま編集へ戻ります。')) {
        setCompetitionState(current);
        isDirty = false;
        teamListDirty = false;
        clearDraftCache();
        render();
        setStatus('サーバーの最新内容を読み込みました。', 'success');
      } else {
        setStatus('保存を中止しました。端末の変更は保持されています。', 'warning');
      }
      return false;
    }

    function clearDraftAndReload() {
      if (!confirm('この端末に一時保存された未確定の変更を削除し、アカウントに保存済みの内容を再読込しますか？')) return;
      clearDraftCache();
      isDirty = false;
      teamListDirty = false;
      loadState();
    }

    function isEditing() {
      return Boolean(appState && appState.canEdit && editModeActive);
    }

    function setStatus(message, type) {
      var element = document.getElementById('statusMessage');
      element.className = 'status-message ' + (type || '');
      element.textContent = message;
    }

    function setLoading(loading) {
      document.getElementById('loadingOverlay').hidden = !loading;
    }

    function normalizeTime(value) {
      var match = String(value || '').match(/(\d{1,2}):(\d{2})/);
      if (!match) return '';
      return String(match[1]).padStart(2, '0') + ':' + match[2];
    }

    function unique(values) {
      return values.filter(function(value, index) { return values.indexOf(value) === index; });
    }
</script>
