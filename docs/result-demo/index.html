<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061014">
<title>GAME RESULT</title>
<style>
:root{
  --bg:#061014;
  --text:#dcfcff;
  --muted:#82adb3;
  --panel:#0a1b20;
  --divider-delay:900ms;
  --card-scale:1;
}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;background:var(--bg);color:var(--text)}
body{min-height:100svh;overflow:hidden;font-family:"Arial Narrow","Roboto Condensed","Yu Gothic","Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased;touch-action:manipulation}
button,input,select{font:inherit}
button{cursor:pointer}
.stage{
  position:relative;
  isolation:isolate;
  display:grid;
  align-items:center;
  min-height:100svh;
  overflow:hidden;
  padding:max(24px,env(safe-area-inset-top)) max(20px,calc(env(safe-area-inset-right) + 16px)) max(80px,calc(env(safe-area-inset-bottom) + 64px)) max(20px,calc(env(safe-area-inset-left) + 16px));
  background:radial-gradient(90% 65% at 85% 10%,rgba(44,120,132,.22),transparent 58%),linear-gradient(145deg,#0a191d,#061014 65%);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.stage::before{content:"";position:absolute;z-index:-1;inset:0;opacity:.14;background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(220,252,255,.13) 4px)}
.card{
  width:min(100%,740px);
  min-width:0;
  margin:auto;
  transform:translateY(-1vh) scale(var(--card-scale));
  transform-origin:center center;
}
.reveal{position:relative;width:fit-content;max-width:100%;min-width:0;margin:0}
.reveal>.ink{display:block;visibility:hidden}
.reveal.prepared>.ink{visibility:visible}
.char{display:inline-block;white-space:pre;opacity:0;transform:translateY(.28em) scaleX(.55);transform-origin:center bottom;filter:blur(4px);will-change:opacity,transform,filter,text-shadow}
.playing .char{animation:char-in 120ms steps(2,end) var(--char-delay) both}
@keyframes char-in{
  0%{opacity:0;transform:translateY(.28em) scaleX(.55);filter:blur(4px);text-shadow:5px 0 rgba(220,252,255,.28)}
  45%{opacity:1;transform:translateY(-.06em) scaleX(1.08);filter:blur(0);text-shadow:-2px 0 rgba(220,252,255,.35)}
  100%{opacity:1;transform:none;filter:none;text-shadow:none}
}
.eyebrow,.meta,.result-label{color:var(--muted);font-weight:900;letter-spacing:.13em;white-space:nowrap}
.eyebrow{font-size:clamp(.56rem,2.5vw,.88rem)}
.title{width:max-content;max-width:none;margin-top:5px;font-size:clamp(3rem,14.5vw,7rem);font-weight:1000;letter-spacing:-.055em;line-height:.84;white-space:nowrap}
.title>.ink{display:inline-flex;white-space:nowrap}
.divider{width:min(100%,650px);height:1px;margin:clamp(18px,4.8vw,30px) 0;background:rgba(220,252,255,.2);transform:scaleX(0);transform-origin:left}
.playing .divider{animation:line .45s ease var(--divider-delay) both}
@keyframes line{to{transform:scaleX(1)}}
.meta{font-size:clamp(.56rem,2.6vw,.84rem)}
.matchup{width:max-content;max-width:none;margin-top:9px;font-size:clamp(1.6rem,7.6vw,3.5rem);font-weight:950;line-height:1.12;letter-spacing:-.035em}
.matchup>.ink{display:inline-flex;align-items:baseline;white-space:nowrap}
.matchup #va,.matchup #vb{display:inline-flex;min-width:0;white-space:nowrap}
.matchup .vs{display:inline-flex;flex:0 0 auto;align-items:center;justify-content:center;margin:0 .26em;color:var(--muted);font-size:.42em;line-height:1;letter-spacing:.1em;vertical-align:.18em}
.matchup.stacked{width:100%;max-width:100%}
.matchup.stacked>.ink{display:grid;width:100%;grid-template-columns:minmax(0,1fr);justify-items:start;white-space:normal;row-gap:.06em}
.matchup.stacked #va,.matchup.stacked #vb{display:flex;width:100%;flex-wrap:wrap;white-space:normal}
.matchup.stacked .vs{justify-self:center;margin:.08em 0;font-size:.38em}
.score{width:max-content;max-width:none;margin-top:clamp(16px,4.7vw,28px);font-size:clamp(4.7rem,25vw,10.4rem);font-weight:1000;letter-spacing:-.075em;line-height:.78;white-space:nowrap;font-variant-numeric:tabular-nums}
.score>.ink{display:inline-grid;grid-template-columns:max-content max-content max-content;column-gap:clamp(12px,2.6vw,22px);align-items:center;white-space:nowrap}
.score b{display:inline-flex;min-width:0;align-items:center;justify-content:center;font-weight:inherit;line-height:.78}
.score .vs{display:inline-flex;align-items:center;justify-content:center;justify-self:center;margin:0;color:var(--muted);font-size:clamp(.82rem,2.8vw,1.5rem);font-style:normal;font-weight:950;line-height:1;letter-spacing:.08em}
.result-label{margin-top:clamp(28px,7vw,44px);font-size:clamp(.58rem,2.7vw,.86rem)}
.outcome{width:fit-content;max-width:100%;margin-top:5px;font-size:clamp(2rem,10vw,5rem);font-weight:1000;line-height:1.05;overflow-wrap:anywhere}
.outcome>.ink{display:block;max-width:100%}
.outcome.wrap{width:100%}
.outcome.wrap>.ink{display:flex;width:100%;flex-wrap:wrap;white-space:normal}
.actions{position:fixed;z-index:10;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:7px}
.pill{min-height:46px;padding:10px 14px;border:1px solid rgba(220,252,255,.28);border-radius:999px;color:var(--text);background:rgba(5,13,16,.72);backdrop-filter:blur(12px);font-size:.69rem;font-weight:900;letter-spacing:.08em}
.pill:active{transform:scale(.95)}
.editor{position:fixed;z-index:30;inset:0;display:grid;align-items:end;background:rgba(0,5,7,.65);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:.18s}
.editor.open{opacity:1;visibility:visible}
.sheet{width:min(100%,620px);max-height:92svh;margin:auto;overflow:auto;padding:22px max(20px,env(safe-area-inset-right)) max(24px,calc(env(safe-area-inset-bottom) + 12px)) max(20px,env(safe-area-inset-left));border:1px solid rgba(220,252,255,.15);border-bottom:0;border-radius:24px 24px 0 0;background:rgba(9,25,30,.98);box-shadow:0 -20px 60px rgba(0,0,0,.45);transform:translateY(24px);transition:.22s}
.editor.open .sheet{transform:none}
.head{display:flex;justify-content:space-between;gap:16px;margin-bottom:18px}
.head p{margin:0 0 4px;color:var(--muted);font-size:.68rem;font-weight:900;letter-spacing:.12em}
.head h2{margin:0;font-size:1.35rem}
.close{width:42px;height:42px;border:1px solid rgba(220,252,255,.18);border-radius:50%;color:var(--text);background:rgba(255,255,255,.04);font-size:1.3rem}
.fields{display:grid;gap:14px}
label{display:grid;gap:7px;color:rgba(220,252,255,.72);font-size:.78rem;font-weight:800}
input,select{width:100%;min-height:50px;padding:12px 14px;border:1px solid rgba(220,252,255,.2);border-radius:12px;color:var(--text);background:#0b1b20;font-size:16px;font-weight:750}
select{appearance:none}
.scores{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px}
.scores>span{padding-bottom:16px;color:var(--muted);font-size:.75rem;font-weight:950}
.custom[hidden]{display:none}
.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.primary,.secondary{min-height:52px;border-radius:13px;font-weight:950}
.primary{border:1px solid var(--text);color:#061014;background:var(--text)}
.secondary{border:1px solid rgba(220,252,255,.24);color:var(--text);background:rgba(255,255,255,.05)}
.notice{min-height:18px;margin:10px 2px 0;color:var(--muted);font-size:.72rem}
@media(min-width:700px){.editor{align-items:center;padding:24px}.sheet{border-bottom:1px solid rgba(220,252,255,.15);border-radius:24px}}
@media(orientation:landscape) and (max-height:560px){
  .stage{align-items:start;padding-top:max(16px,env(safe-area-inset-top))}
  .card{width:88vw;margin-left:4vw;transform:scale(var(--card-scale));transform-origin:left top}
  .title{font-size:clamp(2.5rem,8vw,4.4rem)}
  .divider{margin:12px 0}
  .matchup{font-size:clamp(1.35rem,4.7vw,2.6rem)}
  .score{margin-top:10px;font-size:clamp(3.5rem,11vw,6.2rem)}
  .result-label{margin-top:16px}
  .outcome{font-size:clamp(1.8rem,5.6vw,3.3rem)}
}
@media(prefers-reduced-motion:reduce){.reveal>.ink{visibility:visible}.char{opacity:1;transform:none;filter:none}.playing .char,.playing .divider{animation:none}.divider{transform:none}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="リザルト表示。画面をクリックすると演出を再生します">
<section class="card" id="card">
<p class="reveal eyebrow" data-step="12" data-gap="30" data-max="500"><span class="ink">ROBO SPORTS / MATCH RESULT</span></p>
<h1 class="reveal title" data-step="34" data-gap="90" data-max="650"><span class="ink">GAME RESULT</span></h1>
<div class="divider"></div>
<p class="reveal meta" data-step="14" data-gap="40" data-max="450"><span class="ink">MATCH COMPLETE</span></p>
<p class="reveal matchup" data-step="40" data-gap="70" data-max="1100"><span class="ink"><span id="va">チーム名A</span><span class="vs">VS</span><span id="vb">チーム名B</span></span></p>
<p class="reveal score" data-step="85" data-gap="80" data-max="600" id="score"><span class="ink"><b id="vsa">2</b><i class="vs">VS</i><b id="vsb">1</b></span></p>
<p class="reveal result-label" data-step="30" data-gap="40" data-max="450"><span class="ink" id="label">WINNER</span></p>
<p class="reveal outcome" data-step="50" data-gap="0" data-max="800"><span class="ink" id="vr">チーム名A</span></p>
</section>
</main>
<div class="actions">
<button class="pill" id="edit" type="button">入力</button>
<button class="pill" id="replay" type="button">REPLAY</button>
<button class="pill" id="share" type="button">共有</button>
</div>
<div class="editor" id="editor" role="dialog" aria-modal="true" aria-labelledby="form-title">
<form class="sheet" id="form">
<div class="head"><div><p>RESULT SETTINGS</p><h2 id="form-title">表示内容を入力</h2></div><button class="close" id="close" type="button" aria-label="閉じる">×</button></div>
<div class="fields">
<label>チーム名A<input id="a" type="text" maxlength="40" value="チーム名A" autocomplete="off"></label>
<label>チーム名B<input id="b" type="text" maxlength="40" value="チーム名B" autocomplete="off"></label>
<div class="scores"><label>スコアA<input id="sa" type="number" inputmode="numeric" min="0" max="99" value="2"></label><span>VS</span><label>スコアB<input id="sb" type="number" inputmode="numeric" min="0" max="99" value="1"></label></div>
<label>勝者・結果<select id="type"><option value="draw">引き分け</option><option value="a" selected>チームAの勝利</option><option value="b">チームBの勝利</option><option value="custom">自由入力</option></select></label>
<label class="custom" id="custom-wrap" hidden>表示する勝者・結果<input id="custom" type="text" maxlength="40" placeholder="例：判定中止" autocomplete="off"></label>
</div>
<div class="form-actions"><button class="secondary" id="reset" type="button">初期値に戻す</button><button class="primary" type="submit">演出を表示</button></div>
<p class="notice" id="notice">表示後に「共有」を押すと、この内容をURLで送れます。</p>
</form>
</div>
<script>
const $=id=>document.getElementById(id);
const D={a:"チーム名A",b:"チーム名B",sa:"2",sb:"1",r:"チーム名A"};
const stage=$("stage");
const card=$("card");
const editor=$("editor");
const form=$("form");
const a=$("a");
const b=$("b");
const sa=$("sa");
const sb=$("sb");
const type=$("type");
const custom=$("custom");
const wrap=$("custom-wrap");
const notice=$("notice");
const title=document.querySelector(".title");
const titleInk=title.querySelector(".ink");
const matchup=document.querySelector(".matchup");
const matchupInk=matchup.querySelector(".ink");
const teamAView=$("va");
const teamBView=$("vb");
const scoreLine=$("score");
const scoreInk=scoreLine.querySelector(".ink");
const scoreAView=$("vsa");
const scoreBView=$("vsb");
const outcome=document.querySelector(".outcome");
const outcomeInk=$("vr");
const lines=[...document.querySelectorAll(".reveal")];
const segmenter=typeof Intl.Segmenter==="function"?new Intl.Segmenter("ja",{granularity:"grapheme"}):null;
const characters=text=>segmenter?[...segmenter.segment(text)].map(item=>item.segment):Array.from(text);
const clean=(v,f)=>String(v??"").replace(/[\r\n\t]+/g," ").replace(/\s{2,}/g," ").trim()||f;
const score=v=>String(Math.max(0,Math.min(99,parseInt(v,10)||0)));
const draw=v=>/^(引き分け|引分け|draw)$/i.test(String(v).trim());

function result(){
  return type.value==="a"?clean(a.value,D.a):type.value==="b"?clean(b.value,D.b):type.value==="custom"?clean(custom.value,"結果未入力"):"引き分け";
}
function options(){
  type.options[1].text=`${clean(a.value,"チームA")} の勝利`;
  type.options[2].text=`${clean(b.value,"チームB")} の勝利`;
}
function toggle(){
  wrap.hidden=type.value!=="custom";
  if(!wrap.hidden)setTimeout(()=>custom.focus(),0);
}
function data(){
  return{a:clean(a.value,D.a),b:clean(b.value,D.b),sa:score(sa.value),sb:score(sb.value),r:result()};
}
function setForm(x){
  a.value=x.a;
  b.value=x.b;
  sa.value=x.sa;
  sb.value=x.sb;
  options();
  if(draw(x.r)){type.value="draw";custom.value=""}
  else if(x.r===x.a){type.value="a";custom.value=""}
  else if(x.r===x.b){type.value="b";custom.value=""}
  else{type.value="custom";custom.value=x.r}
  toggle();
}
function setView(x){
  teamAView.textContent=x.a;
  teamBView.textContent=x.b;
  scoreAView.textContent=x.sa;
  scoreBView.textContent=x.sb;
  scoreLine.ariaLabel=`${x.sa} 対 ${x.sb}`;
  $("label").textContent=draw(x.r)?"DRAW":"WINNER";
  outcomeInk.textContent=x.r;
  document.title=`GAME RESULT | ${x.a} vs ${x.b}`;
}
function urlFor(x){
  const u=new URL(location.href);
  u.search="";
  u.searchParams.set("a",x.a);
  u.searchParams.set("b",x.b);
  u.searchParams.set("sa",x.sa);
  u.searchParams.set("sb",x.sb);
  u.searchParams.set("r",x.r);
  return u;
}
function splitCharacters(root){
  const label=root.textContent||"";
  root.setAttribute("aria-label",label);
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){
    if(!node.nodeValue||node.parentElement?.closest(".char"))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  const nodes=[];
  while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    const fragment=document.createDocumentFragment();
    characters(node.nodeValue).forEach(value=>{
      const span=document.createElement("span");
      span.className="char";
      span.textContent=value;
      span.setAttribute("aria-hidden","true");
      fragment.append(span);
    });
    node.replaceWith(fragment);
  });
}
function fitSingleLine(element,inner,minSize){
  element.style.removeProperty("font-size");
  const available=Math.max(1,card.clientWidth);
  const natural=Math.max(1,inner.scrollWidth);
  if(natural<=available)return true;
  const base=parseFloat(getComputedStyle(element).fontSize)||minSize;
  element.style.fontSize=`${Math.max(minSize,base*(available/natural)*.985)}px`;
  return inner.scrollWidth<=available+1;
}
function fitTitle(){
  fitSingleLine(title,titleInk,24);
}
function fitMatchup(){
  matchup.classList.remove("stacked");
  matchup.style.removeProperty("font-size");
  const available=Math.max(1,card.clientWidth);
  const natural=Math.max(1,matchupInk.scrollWidth);
  if(natural<=available)return;
  const base=parseFloat(getComputedStyle(matchup).fontSize)||24;
  const target=base*(available/natural)*.985;
  if(target>=18){
    matchup.style.fontSize=`${target}px`;
    return;
  }
  matchup.classList.add("stacked");
  matchup.style.removeProperty("font-size");
  const widest=Math.max(teamAView.scrollWidth,teamBView.scrollWidth,1);
  if(widest>available){
    const stackedBase=parseFloat(getComputedStyle(matchup).fontSize)||24;
    matchup.style.fontSize=`${Math.max(17,stackedBase*(available/widest)*.985)}px`;
  }
}
function fitScore(){
  scoreLine.style.removeProperty("font-size");
  const available=Math.max(1,card.clientWidth);
  const natural=Math.max(1,scoreInk.scrollWidth);
  if(natural>available){
    const base=parseFloat(getComputedStyle(scoreLine).fontSize)||72;
    scoreLine.style.fontSize=`${Math.max(36,base*(available/natural)*.985)}px`;
  }
}
function fitOutcome(){
  outcome.classList.remove("wrap");
  outcome.style.removeProperty("font-size");
  const available=Math.max(1,card.clientWidth);
  const natural=Math.max(1,outcomeInk.scrollWidth);
  if(natural<=available)return;
  const base=parseFloat(getComputedStyle(outcome).fontSize)||32;
  outcome.style.fontSize=`${Math.max(22,base*(available/natural)*.985)}px`;
  if(outcomeInk.scrollWidth>available+1)outcome.classList.add("wrap");
}
function fitCard(){
  stage.style.setProperty("--card-scale","1");
  const style=getComputedStyle(stage);
  const available=Math.max(1,stage.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom));
  const height=Math.max(1,card.offsetHeight);
  const scale=Math.min(1,available/height);
  stage.style.setProperty("--card-scale",String(Math.max(.72,scale*.985)));
}
function layout(){
  stage.style.setProperty("--card-scale","1");
  fitTitle();
  fitMatchup();
  fitScore();
  fitOutcome();
  fitCard();
}
function prepareTimeline(){
  lines.forEach(line=>{
    const ink=line.querySelector(".ink");
    splitCharacters(ink);
    line.classList.add("prepared");
  });
  layout();
  let cursor=40;
  let dividerDelay=700;
  lines.forEach((line,index)=>{
    const chars=[...line.querySelectorAll(".char")];
    const preferred=Number(line.dataset.step||32);
    const maxSpan=Number(line.dataset.max||800);
    const step=Math.max(12,Math.min(preferred,maxSpan/Math.max(chars.length-1,1)));
    chars.forEach((char,i)=>char.style.setProperty("--char-delay",`${Math.round(cursor+i*step)}ms`));
    const end=cursor+Math.max(chars.length-1,0)*step+120;
    if(index===1)dividerDelay=end+35;
    cursor=end+Number(line.dataset.gap||50);
  });
  stage.style.setProperty("--divider-delay",`${Math.round(dividerDelay)}ms`);
}
function play(){
  stage.classList.remove("playing");
  prepareTimeline();
  void stage.offsetWidth;
  stage.classList.add("playing");
}
function closeEditor(){
  editor.classList.remove("open");
  document.activeElement?.blur();
}
function openEditor(){
  editor.classList.add("open");
  setTimeout(()=>a.focus(),180);
}
function apply(closeSheet=true){
  const x=data();
  setForm(x);
  setView(x);
  history.replaceState(null,"",urlFor(x));
  if(closeSheet)closeEditor();
  requestAnimationFrame(()=>requestAnimationFrame(play));
  return x;
}
async function copy(text){
  if(navigator.clipboard&&isSecureContext)return navigator.clipboard.writeText(text);
  const t=document.createElement("textarea");
  t.value=text;
  t.style.position="fixed";
  t.style.opacity=0;
  document.body.append(t);
  t.select();
  document.execCommand("copy");
  t.remove();
}
async function share(){
  const x=apply(false);
  const url=urlFor(x).toString();
  const text=`${x.a} VS ${x.b}\n${x.sa} VS ${x.sb}\n${x.r}`;
  try{
    if(navigator.share)return await navigator.share({title:"GAME RESULT",text,url});
    await copy(url);
    notice.textContent="共有URLをコピーしました。";
    openEditor();
  }catch(e){
    if(e?.name!=="AbortError"){
      await copy(url);
      notice.textContent="共有URLをコピーしました。";
      openEditor();
    }
  }
}
function fromUrl(){
  const p=new URLSearchParams(location.search);
  if(!p.has("a")&&!p.has("b")&&!p.has("r"))return null;
  return{a:clean(p.get("a"),D.a),b:clean(p.get("b"),D.b),sa:score(p.get("sa")??D.sa),sb:score(p.get("sb")??D.sb),r:clean(p.get("r"),D.r)};
}
function scheduleLayout(){
  cancelAnimationFrame(scheduleLayout.frame);
  scheduleLayout.frame=requestAnimationFrame(layout);
}
form.addEventListener("submit",e=>{e.preventDefault();apply()});
type.addEventListener("change",toggle);
a.addEventListener("input",options);
b.addEventListener("input",options);
$("edit").onclick=openEditor;
$("replay").onclick=play;
$("share").onclick=share;
$("close").onclick=closeEditor;
$("reset").onclick=()=>{setForm(D);notice.textContent="初期値に戻しました。"};
stage.addEventListener("click",()=>{if(!editor.classList.contains("open"))play()});
editor.addEventListener("click",e=>{if(e.target===editor)closeEditor()});
window.addEventListener("resize",scheduleLayout,{passive:true});
window.addEventListener("orientationchange",()=>setTimeout(scheduleLayout,120),{passive:true});
const initial=fromUrl();
setForm(initial||D);
setView(initial||D);
window.addEventListener("pageshow",()=>setTimeout(()=>{play();if(!initial)openEditor()},150));
if(document.fonts?.ready)document.fonts.ready.then(scheduleLayout);
if(typeof ResizeObserver==="function")new ResizeObserver(scheduleLayout).observe(stage);
</script>
</body>
</html>
